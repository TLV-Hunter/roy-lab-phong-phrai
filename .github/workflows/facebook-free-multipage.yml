name: Free Facebook Multi-Page Publisher (Colossus + RLS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'publisher/facebook-free/**'
      - '.github/workflows/facebook-free-multipage.yml'
  schedule:
    # Asia/Bangkok 06:00 Still: UTC 23:00 previous day
    # Try on time, with two retries inside a 30-minute no-backfill window
    - cron: "0,17,27 23 * * *"
    # Asia/Bangkok 23:00 Reel: UTC 16:00 same day
    - cron: "0,17,27 16 * * *"

permissions:
  contents: write

concurrency:
  group: facebook-multi-page-publisher
  cancel-in-progress: false

jobs:
  manual-preview:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Offline regression tests (zero Facebook requests)
        run: python -m unittest discover -s publisher/facebook-free -p 'test_*.py' -v
      - name: QA-gated queue preview (no posting)
        run: python publisher/facebook-free/autopost.py --preview

  scheduled-publish:
    if: github.event_name == 'schedule' && vars.FB_AUTOPUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Publish only approved, configured and due items
        env:
          FB_AUTOPUBLISH_ENABLED: ${{ vars.FB_AUTOPUBLISH_ENABLED }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
          FB_PAGES_JSON: ${{ secrets.FB_PAGES_JSON }}
          FB_ENABLE_FIRST_COMMENT: ${{ vars.FB_ENABLE_FIRST_COMMENT }}
          FB_PAGE_ID_COLOSSUS: ${{ secrets.FB_PAGE_ID_COLOSSUS }}
          FB_PAGE_TOKEN_COLOSSUS: ${{ secrets.FB_PAGE_TOKEN_COLOSSUS }}
          FB_PAGE_ID_RLS: ${{ secrets.FB_PAGE_ID_RLS }}
          FB_PAGE_TOKEN_RLS: ${{ secrets.FB_PAGE_TOKEN_RLS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python publisher/facebook-free/autopost.py
