name: Normalize Colossus Content

on:
  push:
    paths:
      - '.github/workflows/normalize-colossus-content.yml'
      - 'scripts/normalize-colossus-content.mjs'
      - 'colossus/colossus-reel-media.json'
      - 'colossus/colossus-reels.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize current Colossus content state
        run: node scripts/normalize-colossus-content.mjs
      - name: Commit current web source if changed
        run: |
          if git diff --quiet -- colossus/content.json colossus/index.html; then
            echo 'No content changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add colossus/content.json colossus/index.html
          git commit -m 'Sync Colossus Reel readiness and current production state'
          git push
