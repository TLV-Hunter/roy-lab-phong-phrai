<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151018">
<title>BAICHA Content Library</title>
<style>
:root{--b:#05090e;--p:#0d1118;--l:#2b3945;--pink:#f0a9c4;--pink2:#6b3049;--t:#eef8fb;--m:#8ea2ae;--g:#76efa2;--a:#ffd477;--r:#ff9aa8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 0,#2d1723,#05090e 46%);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea,a{font:inherit}button{cursor:pointer}
.top,.wrap{max-width:1760px;margin:auto}.top{padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center}.brand a{color:#fff;text-decoration:none;font-weight:900}.brand small{display:block;color:var(--m);font-size:10px}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn,.controls select{background:#0b1118;color:#f9eef3;border:1px solid #5c4050;border-radius:9px;padding:8px 10px;font-weight:800;text-decoration:none}.controls select{min-width:210px}.btn.on{background:#5b2540}.wrap{padding:14px}
.hero,.filterbar,.card,.modal{background:linear-gradient(#10131a,#080d13);border:1px solid #493543;border-radius:14px}.hero{padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}.hero h1{margin:0;font-size:24px}.hero p{margin:4px 0 0;color:#d8b4c3;font-size:12px}.summary{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;border:1px solid #5d4956;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}
.filterbar{padding:11px;margin-bottom:12px}.tabs,.filters,.actions,.navrow{display:flex;gap:7px;flex-wrap:wrap}.tabs{margin-bottom:9px}.tab{border:1px solid #68475a;background:#1a0e15;color:#ffe8f2;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}.tab.on{background:#5b2540}.filters{display:grid;grid-template-columns:minmax(180px,1fr) repeat(3,minmax(140px,220px));gap:8px}.filters input,.filters select{width:100%;background:#071019;border:1px solid #2d4554;color:#fff;padding:9px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{overflow:hidden;display:flex;flex-direction:column}.thumb{height:300px;background:#020609;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.missing{padding:24px;text-align:center;color:#7d93a0;font-size:11px;line-height:1.6}.missing b{display:block;color:#ffd2e2;font-size:15px}.body{padding:12px;display:grid;gap:8px;flex:1}.meta{display:flex;gap:6px;flex-wrap:wrap}.body h3{font-size:16px;margin:0}.preview{font-size:11px;line-height:1.55;color:#c9d8df;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}.asset{font-size:10px;color:#91a5b0}.actions button,.actions a{border:1px solid #335467;background:#0a2532;color:#e8f8ff;border-radius:7px;padding:7px 8px;font-size:9px;font-weight:900;text-decoration:none}.actions .pink{border-color:#79475f;background:#351724;color:#ffe5ef}.actions .ready{border-color:#39774f;background:#123321;color:#c8ffd8}.empty{grid-column:1/-1;padding:36px;text-align:center;border:1px dashed #475b67;border-radius:14px;color:#8096a2}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;padding:16px}.modal h2{margin:0 0 8px}.close{float:right}.detail{display:grid;gap:10px}.detail pre{white-space:pre-wrap;word-break:break-word;background:#050a0e;border:1px solid #263a46;border-radius:9px;padding:10px;color:#dcebf2}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.editgrid .wide{grid-column:1/3}.editgrid label{display:grid;gap:4px;color:#9eb0ba;font-size:10px}.editgrid input,.editgrid select,.editgrid textarea{width:100%;background:#050d13;color:#fff;border:1px solid #2c4958;border-radius:8px;padding:8px}.editgrid textarea{min-height:92px}.hint{font-size:11px;color:var(--a)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.editgrid{grid-template-columns:1fr}.editgrid .wide{grid-column:auto}.thumb{height:340px}.controls{width:100%}.controls select{flex:1}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><a href="./">🏠 CONTENT DESK</a><div><b>TALENTVEE CONTENT DESK</b><small>BAICHA อยู่ในเว็บเดิม แต่แยกหน้าเพื่อไม่กระทบเพจอื่น</small></div></div><div class="controls"><select id="campaign"><option value="colossus">COLOSSUS SIGNAL — CURRENT SEASON</option><option value="colossus-august">COLOSSUS SIGNAL — SS2 / AUGUST</option><option value="rls">RLS — รอยลับพงไพร</option><option value="bruno">MAYOR BRUNO — WILLOW CREEK</option><option value="baicha" selected>ใบชา — BAICHA</option></select><a class="btn on" href="./baicha.html">BAICHA LIBRARY</a></div></div></header>
<main class="wrap">
<section class="hero"><div><h1>ใบชา — BAICHA CONTENT LIBRARY</h1><p>CONTENT LIBRARY + READY-TO-POST ARCHIVE • ไม่มี Calendar / วันที่ / เวลาโพสต์</p></div><div class="summary"><span class="pill" id="sumAll">0 RECORDS</span><span class="pill" id="sumAsset">0 ASSET REF</span><span class="pill g" id="sumReady">0 READY TO POST</span><button class="btn" onclick="newRecord()">+ ADD CONTENT</button></div></section>
<section class="filterbar"><div class="tabs"><button class="tab on" data-tab="all">ALL</button><button class="tab" data-tab="idea">มุข / IDEA</button><button class="tab" data-tab="image">ภาพนิ่ง</button><button class="tab" data-tab="caption">แคปชั่น</button><button class="tab" data-tab="ready">READY TO POST</button><button class="tab" data-tab="draft">DRAFT / INCOMPLETE</button></div><div class="filters"><input id="search" placeholder="ค้นชื่อ / caption / มุข / category / tag"><select id="type"><option value="">CONTENT TYPE — ALL</option></select><select id="status"><option value="">STATUS — ALL</option></select><select id="category"><option value="">CATEGORY — ALL</option></select></div></section>
<section id="grid" class="grid"></section>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const OVERRIDE_KEY='baicha_content_overrides_v1',LOCAL_KEY='baicha_content_local_records_v1';
const STATUSES=['READY TO POST','APPROVED','DRAFT','INCOMPLETE','NEEDS IMAGE','NEEDS CAPTION','REJECTED','ARCHIVED'];
let BASE={records:[]},TAB='all';
function overrides(){try{return JSON.parse(localStorage.getItem(OVERRIDE_KEY)||'{}')}catch{return{}}}
function saveOverrides(v){localStorage.setItem(OVERRIDE_KEY,JSON.stringify(v))}
function locals(){try{let a=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function saveLocals(v){localStorage.setItem(LOCAL_KEY,JSON.stringify(v))}
function records(){let o=overrides();return [...(BASE.records||[]),...locals()].map(r=>({...r,...(o[r.id]||{}),id:r.id,history:r.history||[],supporting_images:r.supporting_images||[]}))}
function hasAsset(r){return !!String(r.media_url||r.thumbnail||'').trim()}
function hasCopy(r){return !!String(r.caption||'').trim()&&Array.isArray(r.hashtags)&&r.hashtags.length>0&&!!String(r.pinned_comment||'').trim()}
function complete(r){return hasAsset(r)&&hasCopy(r)}
function ready(r){return complete(r)&&['READY TO POST','APPROVED'].includes(String(r.status||''))}
function statusClass(v){v=String(v||'').toUpperCase();return /READY TO POST|APPROVED/.test(v)?'g':/DRAFT|INCOMPLETE|NEEDS/.test(v)?'a':'r'}
function hashText(r){return (r.hashtags||[]).join(' ')}
function driveId(u){return(String(u||'').match(/\/d\/([^/]+)/)||[])[1]||''}
function driveImg(u){let id=driveId(u);return id?'https://lh3.googleusercontent.com/d/'+id+'=w4096':u||''}
function driveAlt(u){let id=driveId(u);return id?'https://drive.google.com/thumbnail?id='+id+'&sz=w4096':''}
window.imageFallback=img=>{let a=img.dataset.alt||'';if(a&&img.dataset.tried!=='1'){img.dataset.tried='1';img.src=a;return}img.style.display='none';let m=img.parentElement?.querySelector('.missing');if(m)m.style.display='block'};
function media(r){let u=r.thumbnail||r.media_url||'';if(!u)return '<div class="missing"><b>THUMBNAIL MISSING</b>ไม่มี Asset URL ที่ยืนยันได้<br>'+esc(r.asset_status||'MISSING')+'</div>';if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return '<video src="'+esc(u)+'" muted controls preload="metadata"></video>';let alt=driveAlt(u);return '<img src="'+esc(driveImg(u))+'" data-alt="'+esc(alt)+'" data-tried="0" onerror="imageFallback(this)" alt="'+esc(r.title||r.id)+'" loading="lazy"><div class="missing" style="display:none"><b>IMAGE LOAD FAILED</b>ตรวจ Asset URL อีกครั้ง</div>'}
async function copyText(t){if(!t)return;try{await navigator.clipboard.writeText(t)}catch{prompt('Copy:',t)}}
function copyField(id,k){let r=records().find(x=>x.id===id);if(!r)return;let t=k==='caption'?r.caption:k==='pinned'?r.pinned_comment:k==='hashtags'?hashText(r):k==='prompt'?r.prompt:k==='all'?'[CAPTION]\n\n'+(r.caption||'')+'\n\n'+hashText(r)+'\n\n[PINNED COMMENT]\n\n'+(r.pinned_comment||''):'';copyText(t)}
function openMedia(id){let r=records().find(x=>x.id===id);if(r?.media_url)window.open(r.media_url,'_blank','noopener')}
function btn(label,fn,cls=''){return '<button class="'+cls+'" onclick="'+fn+'">'+label+'</button>'}
function card(r){let a=[btn('ดูรายละเอียด',"details('"+r.id+"')",'pink')];if(r.media_url)a.push(btn('ดูรูป',"openMedia('"+r.id+"')"));if(r.caption)a.push(btn('COPY CAPTION',"copyField('"+r.id+"','caption')"));if(r.pinned_comment)a.push(btn('COPY PINNED COMMENT',"copyField('"+r.id+"','pinned')"));if((r.hashtags||[]).length)a.push(btn('COPY HASHTAGS',"copyField('"+r.id+"','hashtags')"));if(hasCopy(r))a.push(btn('COPY ALL',"copyField('"+r.id+"','all')",'pink'));if(r.prompt)a.push(btn('COPY PROMPT',"copyField('"+r.id+"','prompt')"));a.push(btn('EDIT',"editRecord('"+r.id+"')"));if(complete(r)&&!ready(r)&&!['REJECTED','ARCHIVED'].includes(r.status))a.push(btn('MARK READY',"markReady('"+r.id+"')",'ready'));return '<article class="card"><div class="thumb">'+media(r)+'</div><div class="body"><div class="meta"><span class="pill">'+esc(r.content_type||'UNKNOWN')+'</span><span class="pill">'+esc(r.category||'UNKNOWN')+'</span><span class="pill '+statusClass(r.status)+'">'+esc(r.status||'UNKNOWN')+'</span></div><h3>'+esc(r.title||r.id)+'</h3><div class="preview">'+esc(r.caption||r.concept||r.notes||'')+'</div><div class="asset">ASSET: '+esc(r.asset_status||'UNKNOWN')+'</div><div class="actions">'+a.join('')+'</div></div></article>'}
function filtered(){let a=records(),q=$('search').value.trim().toLowerCase(),ty=$('type').value,st=$('status').value,cat=$('category').value;return a.filter(r=>{if(TAB==='idea'&&!(r.content_type==='IDEA'||r.category==='Comedy'))return false;if(TAB==='image'&&r.content_type!=='IMAGE')return false;if(TAB==='caption'&&!r.caption)return false;if(TAB==='ready'&&!ready(r))return false;if(TAB==='draft'&&!['DRAFT','INCOMPLETE','NEEDS IMAGE','NEEDS CAPTION'].includes(r.status))return false;if(ty&&r.content_type!==ty)return false;if(st&&r.status!==st)return false;if(cat&&r.category!==cat)return false;if(q){let h=[r.id,r.title,r.content_type,r.category,r.concept,r.caption,r.pinned_comment,r.notes,(r.tags||[]).join(' '),(r.hashtags||[]).join(' ')].join(' ').toLowerCase();if(!h.includes(q))return false}return true})}
function draw(){let a=filtered();$('grid').innerHTML=a.length?a.map(card).join(''):'<div class="empty">ไม่พบรายการตาม Search / Filter นี้</div>'}
function setupFilters(){let a=records();for(const [id,vals] of [['type',[...new Set(a.map(x=>x.content_type).filter(Boolean))].sort()],['status',[...new Set(a.map(x=>x.status).filter(Boolean))].sort()],['category',[...new Set(a.map(x=>x.category).filter(Boolean))].sort()]]){$(id).innerHTML=$(id).options[0].outerHTML+vals.map(v=>'<option>'+esc(v)+'</option>').join('')}$('sumAll').textContent=a.length+' RECORDS';$('sumAsset').textContent=a.filter(r=>r.asset_ref&&r.asset_ref!=='MISSING'&&!String(r.asset_ref).startsWith('UNKNOWN')).length+' ASSET REF';$('sumReady').textContent=a.filter(ready).length+' READY TO POST'}
function overlay(html){document.getElementById('overlay')?.remove();let d=document.createElement('div');d.id='overlay';d.className='overlay';d.innerHTML='<div class="modal"><button class="btn close" onclick="document.getElementById(\'overlay\').remove()">ปิด</button>'+html+'</div>';d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d)}
window.details=id=>{let r=records().find(x=>x.id===id);if(!r)return;let fs=[['ID',r.id],['TYPE / CATEGORY',(r.content_type||'')+' / '+(r.category||'')],['STATUS',r.status],['ASSET STATUS',r.asset_status],['ASSET REF',r.asset_ref],['SOURCE CHAT',r.source_chat],['SOURCE REFERENCE',r.source_reference],['CONCEPT / JOKE',r.concept],['CAPTION',r.caption],['PINNED COMMENT',r.pinned_comment],['HASHTAGS',hashText(r)],['PROMPT',r.prompt],['NOTES',r.notes],['SUPPORTING IMAGES',(r.supporting_images||[]).length?JSON.stringify(r.supporting_images,null,2):'MISSING'],['HISTORY',(r.history||[]).length?JSON.stringify(r.history,null,2):'—']];overlay('<h2>'+esc(r.title||r.id)+'</h2><div class="detail">'+fs.filter(x=>x[1]).map(x=>'<div><b>'+esc(x[0])+'</b><pre>'+esc(x[1])+'</pre></div>').join('')+'</div>')};
window.editRecord=id=>{let r=records().find(x=>x.id===id);if(!r)return;let isBase=(BASE.records||[]).some(x=>x.id===id);overlay('<h2>EDIT — '+esc(r.id)+'</h2><p class="hint">บันทึกใน browser นี้และไม่แตะข้อมูลเพจอื่น</p><div class="editgrid"><label>Title<input id="eTitle" value="'+esc(r.title||'')+'"></label><label>Category<input id="eCat" value="'+esc(r.category||'')+'"></label><label>Status<select id="eStatus">'+STATUSES.map(v=>'<option '+(v===r.status?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>Content Type<input id="eType" value="'+esc(r.content_type||'')+'"></label><label class="wide">Media URL / Thumbnail URL<input id="eMedia" value="'+esc(r.media_url||'')+'" placeholder="ใส่เฉพาะ URL asset จริง"></label><label class="wide">Asset Ref<input id="eAsset" value="'+esc(r.asset_ref||'')+'"></label><label class="wide">Concept / Joke<textarea id="eConcept">'+esc(r.concept||'')+'</textarea></label><label class="wide">Caption<textarea id="eCaption">'+esc(r.caption||'')+'</textarea></label><label class="wide">Pinned Comment<textarea id="ePinned">'+esc(r.pinned_comment||'')+'</textarea></label><label class="wide">Hashtags<textarea id="eHash">'+esc(hashText(r))+'</textarea></label><label class="wide">Prompt<textarea id="ePrompt">'+esc(r.prompt||'')+'</textarea></label><label class="wide">Notes<textarea id="eNotes">'+esc(r.notes||'')+'</textarea></label></div><div class="navrow" style="margin-top:12px"><button class="btn on" onclick="saveEdit(\''+r.id+'\')">SAVE LOCAL</button><button class="btn" onclick="resetEdit(\''+r.id+'\')">'+(isBase?'RESET LOCAL OVERRIDE':'DELETE LOCAL RECORD')+'</button></div>')};
window.saveEdit=id=>{let o=overrides(),base=(BASE.records||[]).find(x=>x.id===id),ls=locals(),local=ls.find(x=>x.id===id),hs=$('eHash').value.trim().split(/[\s,]+/).filter(Boolean).map(x=>x.startsWith('#')?x:'#'+x),p={title:$('eTitle').value.trim()||id,category:$('eCat').value.trim()||'UNKNOWN',status:$('eStatus').value,content_type:$('eType').value.trim()||'IDEA',media_url:$('eMedia').value.trim()||null,thumbnail:$('eMedia').value.trim()||null,asset_ref:$('eAsset').value.trim()||'MISSING',concept:$('eConcept').value.trim()||null,caption:$('eCaption').value.trim()||null,pinned_comment:$('ePinned').value.trim()||null,hashtags:hs,prompt:$('ePrompt').value.trim()||null,notes:$('eNotes').value.trim()};if(p.media_url&&!String((base||local)?.asset_status||'').includes('VERIFIED'))p.asset_status='USER-LINKED / NEEDS SOURCE QA';if(base){o[id]=p;saveOverrides(o)}else if(local){saveLocals(ls.map(x=>x.id===id?{...x,...p}:x))}document.getElementById('overlay')?.remove();setupFilters();draw()};
window.resetEdit=id=>{if((BASE.records||[]).some(x=>x.id===id)){let o=overrides();delete o[id];saveOverrides(o)}else{saveLocals(locals().filter(x=>x.id!==id));let o=overrides();delete o[id];saveOverrides(o)}document.getElementById('overlay')?.remove();setupFilters();draw()};
window.newRecord=()=>{let id='BAI-LOCAL-'+Date.now(),r={id,title:'New BAICHA Content',content_type:'IDEA',category:'Lifestyle',tags:[],thumbnail:null,media_url:null,asset_ref:'MISSING',asset_status:'MISSING',concept:'',caption:null,pinned_comment:null,hashtags:[],prompt:null,supporting_images:[],source_chat:'Added in BAICHA Content Library',source_reference:'LOCAL USER ENTRY',status:'DRAFT',notes:'',created_recovered_from:'Added in website',history:[]},a=locals();a.unshift(r);saveLocals(a);setupFilters();draw();editRecord(id)};
window.markReady=id=>{let r=records().find(x=>x.id===id);if(!r||!complete(r)||['REJECTED','ARCHIVED'].includes(r.status))return alert('ต้องมี Asset + Caption + Hashtags + Pinned Comment ก่อน MARK READY');let o=overrides();o[id]={...(o[id]||{}),status:'READY TO POST'};saveOverrides(o);setupFilters();draw()};
$('campaign').onchange=e=>{let v=e.target.value;if(v==='baicha')return;if(v==='colossus-august'){location.href='./august-season.html';return}location.href='./index.html?campaign='+encodeURIComponent(v)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));draw()});
['search','type','status','category'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',draw));
fetch('./baicha-content.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('baicha-content.json '+r.status);return r.json()}).then(j=>{BASE=j;setupFilters();draw()}).catch(e=>{$('grid').innerHTML='<div class="empty r">LOAD ERROR: '+esc(e.message)+'</div>'});
</script>
</body></html>
