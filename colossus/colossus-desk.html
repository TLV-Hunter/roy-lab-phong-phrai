<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05090e"><title>Colossus Signal Content Desk</title>
<style>
:root{--b:#05090e;--p:#09131c;--p2:#061018;--l:#173142;--c:#58d9ff;--t:#e9faff;--m:#7894a6;--g:#76efa2;--a:#ffd477;--r:#ff9aa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#0e2b3b,#05090e 42%);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,a{font:inherit}button{cursor:pointer}.top,.wrap{max-width:1760px;margin:auto}.top{padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand a{color:#dff8ff;text-decoration:none;font-weight:900}.brand small{display:block;color:var(--m);font-size:10px}.controls,.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn,.toolbar select{background:#07131c;color:#dff8ff;border:1px solid #28506a;border-radius:9px;padding:8px 10px;font-weight:800;text-decoration:none}.btn.on{background:#0b4058}.wrap{padding:14px}.panel,.episode,.slot{background:linear-gradient(#0a121b,#071019);border:1px solid var(--l);border-radius:14px}.panel{padding:11px 13px;margin-bottom:12px}.toolbar select{min-width:470px;max-width:100%}.statusline{color:#bff2ff;font-size:11px;margin-top:8px}.search{width:100%;background:#071019;border:1px solid #203a4b;color:#fff;padding:11px;border-radius:10px;margin-top:10px}.episodes{display:grid;gap:14px}.episode{overflow:hidden}.ephead{padding:12px 14px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ephead h2{margin:0;font-size:19px}.date{color:var(--c);font-size:11px;margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-block;border:1px solid #315167;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;white-space:nowrap}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}.slot{overflow:hidden;min-width:0}.slothead{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--l);background:#07131b}.slothead b{font-size:13px}.viewer{height:68vh;min-height:560px;max-height:900px;background:#020609;display:flex;align-items:center;justify-content:center;position:relative}.viewer iframe,.viewer img{width:100%;height:100%;border:0;background:#020609}.viewer img{object-fit:contain}.waiting{padding:28px;text-align:center;color:#6f8da0;line-height:1.7}.waiting b{display:block;color:var(--a);font-size:16px;margin-bottom:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px}.actions a{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:8px;text-align:center;text-decoration:none;font-size:10px;font-weight:800}.copybox{padding:0 8px 8px}.copyhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0 5px}.copyhead button{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:800}.text{white-space:pre-wrap;background:#061018;border:1px solid #1c3545;padding:10px;border-radius:9px;line-height:1.48;font-size:12px;min-height:64px}.pending{padding:10px;border:1px dashed #5a4d20;background:#171408;color:#ffe49a;border-radius:9px;font-size:11px}.all .viewer{height:430px;min-height:430px}@media(max-width:1350px){.three{grid-template-columns:1fr 1fr}.reelslot{grid-column:1/3}.viewer{height:64vh;min-height:520px}}@media(max-width:850px){.three{grid-template-columns:1fr}.reelslot{grid-column:auto}.viewer{height:68vh;min-height:430px}.toolbar select{min-width:0;width:100%}.toolbar .btn{flex:1}.ephead{flex-direction:column}.badges{justify-content:flex-start}}
</style>
</head><body><header><div class="top"><div class="brand"><a href="./">← COLOSSUS HOME</a><div><b>COLOSSUS SIGNAL — CONTENT DESK</b><small>MASTER STILL + STARTER + FINAL REEL • Colossus only</small></div></div><div class="controls"><a class="btn" href="./plan.html">PUBLISHER</a></div></div></header><main class="wrap"><div class="panel"><div class="toolbar"><select id="episodeSel"></select><button class="btn" id="prev">← ก่อนหน้า</button><button class="btn" id="next">ถัดไป →</button><button class="btn on" id="one">ดู 1 ตอน</button><button class="btn" id="all">ดูทั้งหมด</button></div><input id="search" class="search" placeholder="ค้นหา CS / title / caption"><div class="statusline">โครงแบบเดียวกับ RLS Desk แต่ใช้เฉพาะข้อมูลและ Asset ของ Colossus Signal — ไม่แตะไฟล์หรือสถานะของ RLS</div></div><div id="list" class="episodes"></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let CONTENT={episodes:[]},START={entries:[]},REELS={entries:[]},MODE='single';
function pass(v){return /pass|ready|locked|published/i.test(String(v||''))}function cls(v){return pass(v)?'g':/pending|planned|waiting/i.test(String(v||''))?'a':'r'}function driveId(u){return(String(u||'').match(/\/d\/([^/]+)/)||[])[1]||''}function preview(u){let id=driveId(u);return id?`https://drive.google.com/thumbnail?id=${id}&sz=w1600`:u||''}function view(u){let id=driveId(u);return id?`https://drive.google.com/file/d/${id}/preview`:u||''}function dl(u){let id=driveId(u);return id?`https://drive.google.com/uc?export=download&id=${id}`:u||''}function starter(id){return(START.entries||[]).find(x=>x.id===id)||{}}function reel(id){return(REELS.entries||[]).find(x=>x.id===id)||{}}function mergeReels(base,media){let map=new Map((base.entries||[]).map(x=>[x.id,{...x}]));for(const m of(media.entries||[])){let old=map.get(m.id)||{id:m.id};map.set(m.id,{...old,...m})}return{...base,entries:[...map.values()]}}
function copyBlock(title,text,qa,key){if(!pass(qa))return `<div class="copybox"><div class="copyhead"><b>${title}</b><span class="pill a">COPY QA PENDING</span></div><div class="pending">ซ่อนข้อความไว้จนกว่า COPY QA จะ PASS</div></div>`;return `<div class="copybox"><div class="copyhead"><b>${title}</b><button onclick="copyText('${key}')">COPY</button></div><div class="text" id="${key}">${esc(text||'')}</div></div>`}window.copyText=async id=>{let t=$(id)?.innerText||'';try{await navigator.clipboard.writeText(t)}catch{prompt('Copy:',t)}};
function imageSlot(title,u,qa,id,kind,copyHtml){let has=!!u;return `<div class="slot"><div class="slothead"><b>${title}</b><span class="pill ${cls(qa)}">${esc(qa||'—')}</span></div><div class="viewer">${has?`<img src="${esc(preview(u))}" alt="${esc(id+' '+kind)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><iframe src="${esc(view(u))}" style="display:none"></iframe>`:`<div class="waiting"><b>ASSET NOT READY</b>ยังไม่มี Asset สำหรับช่องนี้</div>`}</div><div class="actions">${has?`<a href="${esc(u)}" target="_blank">OPEN ORIGINAL</a><a href="${esc(dl(u))}" target="_blank">DOWNLOAD</a>`:'<span></span><span></span>'}</div>${copyHtml||''}</div>`}
function reelSlot(e){let r=reel(e.id),u=r.media_url||'';let media=u?`<iframe src="${esc(view(u))}" allow="autoplay"></iframe>`:`<div class="waiting"><b>FINAL REEL NOT READY</b>รอ Final Reel</div>`;return `<div class="slot reelslot"><div class="slothead"><b>REEL • FINAL</b><span class="pill ${cls(r.status||'WAITING')}">${esc(r.qa||r.status||'WAITING')}</span></div><div class="viewer">${media}</div><div class="actions">${u?`<a href="${esc(u)}" target="_blank">OPEN REEL</a><a href="${esc(dl(u))}" target="_blank">DOWNLOAD</a>`:'<span></span><span></span>'}</div>${copyBlock('REEL CAPTION',r.caption,r.copy_qa,'rcap-'+e.id)}${copyBlock('REEL FIRST COMMENT',r.pinned_comment,r.copy_qa,'rpin-'+e.id)}</div>`}
function card(e){let st=e.still||{},s=starter(e.id),mq=st.qa1||st.qa2||st.status||'',sq=s.starter_qa||'',pq=s.prompt_qa||'';let master=imageSlot('MASTER STILL • 4K',st.media_url,mq,e.id,'master',copyBlock('STILL CAPTION',st.caption,st.copy_qa||'PASS','scap-'+e.id)+copyBlock('FIRST / PINNED COMMENT',st.pinned_comment,st.copy_qa||'PASS','spin-'+e.id));let start=imageSlot('STARTER FRAME',s.starter_url,sq,e.id,'starter',copyBlock('REEL VIDEO PROMPT',s.prompt,pq,'prompt-'+e.id));return `<article class="episode"><div class="ephead"><div><h2>${esc(e.id)} — ${esc(e.title||'')}</h2><div class="date">${esc(e.schedule?.reel||'—')} Reel • ${esc(e.schedule?.linked_still||'—')} Still</div></div><div class="badges"><span class="pill ${cls(mq)}">MASTER ${esc(mq||'—')}</span><span class="pill ${cls(sq)}">STARTER ${esc(sq||'—')}</span><span class="pill ${cls(pq)}">PROMPT ${esc(pq||'—')}</span></div></div><div class="three">${master}${start}${reelSlot(e)}</div></article>`}
function render(){let a=(CONTENT.episodes||[]).filter(e=>/^CS-/.test(e.id||'')),saved=localStorage.getItem('colossus_desk_episode'),sel=(saved&&a.some(x=>x.id===saved))?saved:(a.find(x=>x.id==='CS-005')?.id||a[0]?.id||'');if(!$('episodeSel').options.length){$('episodeSel').innerHTML=a.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} • ${esc(x.title||'')}</option>`).join('');$('episodeSel').value=sel}let q=$('search').value.toLowerCase(),chosen=$('episodeSel').value;localStorage.setItem('colossus_desk_episode',chosen);let rows=MODE==='all'?a.filter(x=>JSON.stringify(x).toLowerCase().includes(q)):a.filter(x=>x.id===chosen);$('list').className=MODE==='all'?'episodes all':'episodes';$('list').innerHTML=rows.map(card).join('')}
$('episodeSel').onchange=()=>{MODE='single';$('one').classList.add('on');$('all').classList.remove('on');render()};$('search').oninput=render;$('one').onclick=()=>{MODE='single';$('one').classList.add('on');$('all').classList.remove('on');render()};$('all').onclick=()=>{MODE='all';$('all').classList.add('on');$('one').classList.remove('on');render()};function move(n){let a=(CONTENT.episodes||[]).filter(e=>/^CS-/.test(e.id||'')),i=a.findIndex(x=>x.id===$('episodeSel').value);if(i<0)return;i=(i+n+a.length)%a.length;$('episodeSel').value=a[i].id;MODE='single';render();scrollTo({top:0,behavior:'smooth'})}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
Promise.all([fetch('./content.json?v='+Date.now()).then(r=>r.json()),fetch('./colossus-starters.json?v='+Date.now()).then(r=>r.json()),fetch('./colossus-reels.json?v='+Date.now()).then(r=>r.json()),fetch('./colossus-reel-media.json?v='+Date.now()).then(r=>r.json()).catch(()=>({entries:[]}))]).then(([c,s,r,m])=>{CONTENT=c;START=s;REELS=mergeReels(r,m);render()}).catch(e=>{$('list').innerHTML=`<div class="panel r">LOAD ERROR: ${esc(e.message)}</div>`});
</script></body></html>
