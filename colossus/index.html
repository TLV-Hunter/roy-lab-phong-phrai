<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05090e"><title>RLS AI Studio Content Desk</title><style>
:root{--bg:#05090e;--p:#0a121b;--line:#173142;--cyan:#58d9ff;--txt:#e7f9ff;--mut:#7894a6;--g:#7de3a0;--a:#ffd477;--r:#ff9aa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 0,#0d2533,#05090e 42%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;background:#05090ef2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.top{max-width:1180px;margin:auto;padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand b{letter-spacing:1.5px}.brand small{display:block;color:var(--mut);margin-top:3px}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls select,.btn{background:#07131c;color:#dff8ff;border:1px solid #28506a;border-radius:9px;padding:8px 10px;font-weight:800;text-decoration:none}.btn.on{background:#0b3950;border-color:#49b5dd}.wrap{max-width:1180px;margin:auto;padding:14px}.view{display:none}.view.on{display:block}.mode,.rule{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#07131b;display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;align-items:center}.mode span{color:var(--a);font-size:11px;text-align:right}.rule{border-color:#28506a;background:#071823;display:block}.rule b{color:#bff2ff}.rule small{display:block;color:var(--mut);margin-top:4px}.search{width:100%;background:#071019;border:1px solid #203a4b;color:var(--txt);padding:12px;border-radius:10px;margin-bottom:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card,.panel{background:linear-gradient(#0a121b,#071019);border:1px solid var(--line);border-radius:15px;overflow:hidden}.head{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:9px}.title b{font-size:18px}.title span{display:block;color:#79d8f4;font-size:11px;margin-top:2px}.tag{font-size:10px;border:1px solid #315167;border-radius:999px;padding:5px 7px;height:max-content}.body{padding:12px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.meta div{background:#07131b;border:1px solid #183244;border-radius:9px;padding:8px}.meta small{display:block;color:#6e899b;font-size:8px;letter-spacing:.8px}.meta strong{font-size:11px}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}.media{background:#03080c;border:1px solid #1b394b;border-radius:11px;overflow:hidden;margin-bottom:10px}.mediaStage{min-height:250px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px}.media img{display:block;width:100%;max-height:560px;object-fit:contain}.mediaActions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px}.mediaActions button,.mediaActions a{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:8px;text-align:center;text-decoration:none;font-size:11px;font-weight:800}.box{margin:10px 0}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.boxhead b{font-size:10px;letter-spacing:1px}.copy{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:6px 9px;font-weight:800}.text{white-space:pre-wrap;background:#061018;border:1px solid #1c3545;padding:10px;border-radius:9px;line-height:1.45;font-size:13px}.note{border-left:2px solid #3296ba;background:#07151e;color:#7895a8;padding:9px 10px;font-size:11px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:#071019;color:#9ab8c9;border:1px solid #254154;border-radius:8px;padding:8px;font-weight:800}.tabs button.on{background:#0c4057;color:#fff}.pane{display:none}.pane.on{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}.stat{padding:14px;background:#08131c;border:1px solid var(--line);border-radius:13px}.stat b{display:block;font-size:23px}.stat small{color:var(--mut)}.batch{padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:#08131c}.bar{height:7px;background:#14232d;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#4bcf84}.calendar{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:980px;background:#071019}th,td{padding:9px;border-bottom:1px solid #173142;text-align:left;vertical-align:top;font-size:11px}th{color:#7995a8;background:#09151e;letter-spacing:.8px}.pill{display:inline-block;border:1px solid #315167;border-radius:999px;padding:4px 7px;font-size:9px}.pill.pass,.pill.ready,.pill.scheduled,.pill.published,.pill.locked,.pill.masterpass{color:var(--g);border-color:#2f6944}.pill.hold,.pill.waiting,.pill.pending,.pill.qapending,.pill.readytogenerate{color:var(--a);border-color:#6d5c28}.pill.blocked,.pill.revise,.pill.rebuild,.pill.blockedvideo,.pill.blockedpromptqa,.pill.blockedrevise,.pill.blockedrebuild,.pill.needsmasterstill{color:var(--r);border-color:#74404a}.daily{border:1px solid var(--line);border-radius:13px;overflow:hidden}.day{display:grid;grid-template-columns:105px 100px 1fr 1fr;gap:0;border-bottom:1px solid var(--line);background:#071019}.day:last-child{border-bottom:0}.daydate{padding:13px;background:#09151e}.daydate b{display:block}.daydate small{color:var(--mut)}.slot{padding:11px 13px;border-left:1px solid var(--line)}.slothead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.slot input{width:20px;height:20px;accent-color:#4bcf84}.slot.done{background:#07180f}.thumbcell{padding:8px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center}.thumb{width:72px;height:96px;border:1px solid #24475a;border-radius:9px;background:#03080c;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#6e899b;font-size:8px;text-align:center}.thumb img{width:100%;height:100%;object-fit:cover}.thumb a{color:#83ddff;text-decoration:none;padding:6px}.thumbtools{display:flex;gap:4px;margin-top:4px}.thumbtools button{font-size:8px;padding:3px 5px;border:1px solid #28506a;background:#071823;color:#bfeeff;border-radius:5px}.doneText{color:var(--g);font-weight:900}.foot{text-align:center;color:#5f7a8c;font-size:10px;padding:22px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0a3041;border:1px solid #2d7593;color:#e5f9ff;padding:10px 14px;border-radius:10px;font-size:12px;z-index:99;display:none}
@media(max-width:780px){.cards{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.controls{width:100%}.controls select{flex:1}.wrap{padding:10px}.day{grid-template-columns:82px 76px 1fr}.day .slot:last-child{grid-column:1/4;border-left:0;border-top:1px solid var(--line)}.thumb{width:58px;height:78px}.mode{align-items:flex-start;flex-direction:column}.mode span{text-align:left}.mediaActions{grid-template-columns:1fr}}
</style></head><body><header><div class="top"><div class="brand"><b>RLS AI STUDIO CONTENT DESK</b><small>GitHub Pages • COLOSSUS + RLS • one workspace</small></div><div class="controls"><select id="campaign" onchange="switchCampaign(this.value)"><option value="colossus">COLOSSUS SIGNAL</option><option value="rls">RLS — รอยลับพงไพร</option></select><button class="btn on" data-v="desk">DESK</button><button class="btn" data-v="checklist">CHECKLIST</button><button class="btn" data-v="calendar">CALENDAR</button><button class="btn" data-v="batch">BATCH QA</button><a class="btn" id="publisherLink" href="./plan.html">PUBLISHER</a><button class="btn" onclick="load()">↻</button></div></div></header><main class="wrap"><div class="mode"><b id="brandName">Loading…</b><span id="modeText"></span></div><div id="dailyRule" class="rule"></div><section id="desk" class="view on"><input id="q" class="search" placeholder="ค้นหา ID, title, caption..." oninput="renderDesk()"><div id="list" class="cards"></div></section><section id="checklist" class="view"><div id="checklistView"></div></section><section id="calendar" class="view"><div id="calendarView"></div></section><section id="batch" class="view"><div id="batchView"></div></section><div class="foot">Campaign-aware Desk • Checklist • Calendar • Batch QA • Master Still archive • Publisher</div></main><div id="toast" class="toast"></div><script>
let DATA={episodes:[]},PLAN={days:[]},CAMPAIGN=localStorage.getItem('rls_desk_campaign')||'colossus',MEDIA=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cls=s=>{s=String(s||'').toLowerCase();return s.includes('pass')||s.includes('ready')||s.includes('scheduled')||s.includes('published')||s.includes('locked')?'g':s.includes('wait')||s.includes('hold')||s.includes('pending')?'a':'r'};
function pill(s){let c=String(s||'').toLowerCase().replace(/[^a-z]/g,'');return `<span class="pill ${c}">${esc(s||'—')}</span>`}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',1400)}
function switchCampaign(v){CAMPAIGN=v;localStorage.setItem('rls_desk_campaign',v);MEDIA.clear();load()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.v).classList.add('on')});
function epById(id){return (DATA.episodes||[]).find(e=>e.id===id)}
function colossusDays(){return (DATA.calendar||[]).map(x=>{const id=(String(x.title).match(/CS-\d{3}/)||[])[0]||'',ep=epById(id)||{},ps=String(x.publish_status||'').toUpperCase(),times=String(x.time||'').split('/').map(s=>s.trim()),reelTime=times[0]||'01:00',stillTime=times[1]||'08:30';let stillStatus='WAITING',reelStatus='WAITING';if(ps==='PUBLISHED'){stillStatus='PUBLISHED';reelStatus='PUBLISHED'}else{if(ps.includes('STILL PUBLISHED'))stillStatus='PUBLISHED';else if(ps.includes('STILL SCHEDULED'))stillStatus='SCHEDULED';else if(String(x.asset_status).includes('MASTER PASS'))stillStatus='READY';else if(ps.includes('BLOCKED'))stillStatus='BLOCKED';if(ps.includes('REEL PUBLISHED'))reelStatus='PUBLISHED';else if(ps.includes('REEL SCHEDULED'))reelStatus='SCHEDULED';else if(String(ep.reel?.status||'').toUpperCase()==='PUBLISHED')reelStatus='PUBLISHED';else if(String(ep.reel?.status||'').toUpperCase()==='SCHEDULED')reelStatus='SCHEDULED';else if(ps.includes('BLOCKED'))reelStatus='BLOCKED'}return {date:x.date,title:x.title,id,still:{time:stillTime,status:stillStatus,asset_status:x.asset_status||'',posted:stillStatus==='PUBLISHED'},reel:{time:reelTime,status:reelStatus,asset_status:String(ep.reel?.status||'WAITING').toUpperCase(),posted:reelStatus==='PUBLISHED'}}})}
async function load(){campaign.value=CAMPAIGN;publisherLink.style.display=CAMPAIGN==='colossus'?'inline-block':'none';try{DATA=await(await fetch((CAMPAIGN==='rls'?'./rls-content.json':'./content.json')+'?ts='+Date.now(),{cache:'no-store'})).json();if(CAMPAIGN==='rls')PLAN=await(await fetch('./rls-plan.json?ts='+Date.now(),{cache:'no-store'})).json();else PLAN={mode:DATA.mode||'',days:colossusDays()};brandName.textContent=DATA.brand||'';modeText.textContent=CAMPAIGN==='rls'?(PLAN.mode||'DAILY PUBLISH'):(DATA.mode||'');dailyRule.innerHTML=CAMPAIGN==='rls'?'<b>RLS LOCKED RULE: ทุกวัน = 1 REEL + ภาพนิ่งอย่างน้อย 1 ภาพ</b><small>Starter Frame เป็น production asset และไม่ถือเป็น public still</small>':'<b>COLOSSUS BASELINE: REEL 01:00 + LINKED STILL 08:30</b><small>CHECKLIST ด้านล่างอ่านจาก Campaign Plan จริง • Master Still จะแสดงเมื่อไฟล์ถูก archive แล้ว</small>';renderDesk();renderChecklist();renderCalendar();renderBatch()}catch(e){list.innerHTML='<div class="note">โหลดข้อมูลไม่สำเร็จ • '+esc(e.message)+'</div>';checklistView.innerHTML='<div class="note">Checklist load failed • '+esc(e.message)+'</div>'}}
function box(t,x){return `<div class="box"><div class="boxhead"><b>${t}</b><button class="copy" onclick="copyBox(this)">COPY</button></div><div class="text">${esc(x||'')}</div></div>`}
function driveThumb(u){const m=String(u||'').match(/\/d\/([^/]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w600':''}
async function getMedia(id){if(MEDIA.has(id))return MEDIA.get(id);const p=epById(id)?.still||{},a=p.image_asset;if(a){let chunks=[];for(let i=1;i<=a.parts;i++){let n=String(i).padStart(2,'0'),r=await fetch(`${a.base_path}part${n}.txt?ts=${DATA.updated_at||''}`,{cache:'force-cache'});if(!r.ok)throw Error('asset part '+n);chunks.push((await r.text()).trim())}let bin=atob(chunks.join('')),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);let blob=new Blob([bytes],{type:a.mime||'image/avif'}),url=URL.createObjectURL(blob),m={blob,url,filename:a.filename||id+'_MASTER.jpg'};MEDIA.set(id,m);return m}if(p.preview_url){let r=await fetch(p.preview_url),blob=await r.blob(),m={blob,url:p.preview_url,filename:id+'_MASTER.jpg'};MEDIA.set(id,m);return m}throw Error('No archived local image')}
function media(p,id){if(p.image_asset)return `<div class="media"><div class="mediaStage" id="media-${esc(id)}">Loading Master Image…</div><div class="mediaActions"><button onclick="copyImage('${esc(id)}')">COPY IMAGE</button><button onclick="downloadImage('${esc(id)}')">DOWNLOAD</button>${p.media_url?`<a href="${esc(p.media_url)}" target="_blank">OPEN DRIVE</a>`:''}</div></div>`;if(p.preview_url)return `<div class="media"><img src="${esc(p.preview_url)}" alt="master still"><div class="mediaActions"><button onclick="copyImage('${esc(id)}')">COPY IMAGE</button><button onclick="downloadImage('${esc(id)}')">DOWNLOAD</button>${p.media_url?`<a href="${esc(p.media_url)}" target="_blank">OPEN DRIVE</a>`:''}</div></div>`;if(p.media_url){let t=driveThumb(p.media_url);return `<div class="media">${t?`<img src="${esc(t)}" alt="master still">`:''}<a href="${esc(p.media_url)}" target="_blank">OPEN MASTER IMAGE ↗</a></div>`}return''}
function pane(ep,type){const p=ep[type]||{};return `<div class="pane ${type==='still'?'on':''} ${type}"><div class="meta"><div><small>STATUS</small><strong class="${cls(p.status)}">${esc(String(p.status||'—').toUpperCase())}</strong></div><div><small>POST TIME</small><strong>${esc(p.post_time||'—')}</strong></div><div><small>QA1</small><strong class="${cls(p.qa1)}">${esc(p.qa1||'—')}</strong></div><div><small>QA2</small><strong class="${cls(p.qa2)}">${esc(p.qa2||'—')}</strong></div></div>${type==='still'?media(p,ep.id):''}${box((type==='reel'?'REEL':'STILL')+' CAPTION',p.caption)}${box('FIRST / PINNED COMMENT',p.pinned_comment)}</div>`}
function starter(ep){const s=ep.starter;if(!s)return'';return `<div class="pane starter"><div class="meta"><div><small>FRAME QA</small><strong class="${cls(s.frame_qa)}">${esc(s.frame_qa||'—')}</strong></div><div><small>PROMPT QA</small><strong class="${cls(s.prompt_qa)}">${esc(s.prompt_qa||'—')}</strong></div><div><small>STATUS</small><strong class="${cls(s.status)}">${esc(String(s.status||'—').toUpperCase())}</strong></div><div><small>ROLE</small><strong>PRODUCTION ASSET</strong></div></div>${s.prompt_qa==='PASS'&&s.prompt?box('QA-APPROVED VIDEO PROMPT',s.prompt):'<div class="note">Prompt ยังไม่แสดงจนกว่า Prompt QA = PASS</div>'}</div>`}
function renderDesk(){const q=(document.getElementById('q').value||'').toLowerCase(),a=(DATA.episodes||[]).filter(e=>JSON.stringify(e).toLowerCase().includes(q));list.innerHTML=a.length?a.map(e=>`<article class="card"><div class="head"><div class="title"><b>${esc(e.id)}</b><span>${esc(e.title||'')} • ${esc(e.batch||'')}</span></div><span class="tag">${esc(e.slot?'#'+e.slot:'CONTENT')}</span></div><div class="body"><div class="tabs"><button class="on" onclick="tab(this,'still')">STILL</button><button onclick="tab(this,'reel')">REEL</button>${e.starter?`<button onclick="tab(this,'starter')">STARTER</button>`:''}</div>${pane(e,'still')}${pane(e,'reel')}${starter(e)}<div class="note">${esc(e.note||'')}</div></div></article>`).join(''):'<div class="note">ไม่พบ Content</div>';a.filter(e=>e.still?.image_asset).forEach(e=>loadDeskImage(e.id))}
async function loadDeskImage(id){try{const m=await getMedia(id),el=document.getElementById('media-'+id);if(el)el.innerHTML=`<img src="${m.url}" alt="${esc(id)} Master" style="max-height:560px;width:100%;object-fit:contain">`}catch(e){}}
function tab(b,t){const c=b.closest('.card');c.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');c.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));c.querySelector('.'+t).classList.add('on')}
function copyBox(b){const t=b.closest('.box').querySelector('.text').innerText;navigator.clipboard?.writeText(t).catch(()=>prompt('Copy:',t))}
async function copyImage(id){try{const m=await getMedia(id);if(!navigator.clipboard||!window.ClipboardItem)throw Error();await navigator.clipboard.write([new ClipboardItem({[m.blob.type]:m.blob})]);toast('COPY IMAGE ✓ '+id)}catch(e){toast('Copy ไม่สำเร็จ • ใช้ Download')}}
async function downloadImage(id){try{const m=await getMedia(id),a=document.createElement('a');a.href=m.url;a.download=m.filename;a.click();toast('DOWNLOAD ✓ '+id)}catch(e){const u=epById(id)?.still?.media_url;if(u)window.open(u,'_blank')}}
function key(d,type){return CAMPAIGN+'_posted_'+d+'_'+type}function checked(day,type){const x=day[type];return x?.posted===true||String(x?.status).toUpperCase()==='PUBLISHED'||localStorage.getItem(key(day.date,type))==='1'}function toggle(i,type,on){const d=(PLAN.days||[])[i];if(!d)return;localStorage.setItem(key(d.date,type),on?'1':'0');renderChecklist();renderCalendar()}
function thumbHtml(d){if(CAMPAIGN!=='colossus')return '<div class="thumb">RLS<br>DAILY</div>';const ep=epById(d.id),p=ep?.still||{};if(p.image_asset)return `<div><div class="thumb" id="thumb-${esc(d.id)}">Loading…</div><div class="thumbtools"><button onclick="copyImage('${esc(d.id)}')">COPY</button><button onclick="downloadImage('${esc(d.id)}')">SAVE</button></div></div>`;if(p.preview_url)return `<div><div class="thumb"><img src="${esc(p.preview_url)}"></div><div class="thumbtools"><button onclick="copyImage('${esc(d.id)}')">COPY</button><button onclick="downloadImage('${esc(d.id)}')">SAVE</button></div></div>`;if(p.media_url){let t=driveThumb(p.media_url);return `<div class="thumb">${t?`<a href="${esc(p.media_url)}" target="_blank"><img src="${esc(t)}"></a>`:`<a href="${esc(p.media_url)}" target="_blank">OPEN MASTER</a>`}</div>`}return `<div class="thumb">${String(d.still?.asset_status||'').includes('MASTER PASS')?'MASTER PASS<br>FILE NOT ARCHIVED':'NO MASTER<br>ARCHIVED'}</div>`}
function slotHtml(d,type,i){const x=d[type]||{},yes=checked(d,type);return `<div class="slot ${yes?'done':''}"><div class="slothead"><b>${type==='still'?'🖼 STILL':'🎬 REEL'} • ${esc(x.time||'—')}</b><input type="checkbox" ${yes?'checked':''} onchange="toggle(${i},'${type}',this.checked)"></div><div>${yes?'<span class="doneText">✓ POSTED</span>':pill(x.status)}</div><small style="color:var(--mut)">${esc(x.asset_status||'')}</small></div>`}
function renderChecklist(){const days=PLAN.days||[],doneStill=days.filter(d=>checked(d,'still')).length,doneReel=days.filter(d=>checked(d,'reel')).length;checklistView.innerHTML=`<div class="stats"><div class="stat"><small>CAMPAIGN DAYS</small><b>${days.length}</b></div><div class="stat"><small>STILLS POSTED</small><b>${doneStill}/${days.length}</b></div><div class="stat"><small>REELS POSTED</small><b>${doneReel}/${days.length}</b></div><div class="stat"><small>CAMPAIGN</small><b style="font-size:14px">${esc(DATA.brand||'')}</b></div></div><div class="daily">${days.map((d,i)=>`<div class="day"><div class="daydate"><b>${esc(d.date)}</b><small>${esc(d.id||'')}</small></div><div class="thumbcell">${thumbHtml(d)}</div>${slotHtml(d,'still',i)}${slotHtml(d,'reel',i)}</div>`).join('')}</div>`;if(CAMPAIGN==='colossus')days.filter(d=>epById(d.id)?.still?.image_asset).forEach(d=>loadThumb(d.id))}
async function loadThumb(id){try{const m=await getMedia(id),el=document.getElementById('thumb-'+id);if(el)el.innerHTML=`<img src="${m.url}" alt="${esc(id)}">`}catch(e){}}
function renderCalendar(){const a=PLAN.days||[];calendarView.innerHTML=`<div class="panel body"><b>${esc(DATA.brand||'')} — CAMPAIGN CALENDAR</b><p style="color:var(--mut)">${CAMPAIGN==='colossus'?'Reel 01:00 / Linked Still 08:30 baseline (Thailand)':'Every day: 1 Reel + at least 1 public Still'}</p></div><div class="calendar"><table><thead><tr><th>Date</th><th>Story</th><th>Still</th><th>Still Asset</th><th>Reel</th><th>Reel Asset</th></tr></thead><tbody>${a.map(d=>`<tr><td><b>${esc(d.date)}</b></td><td>${esc(d.title)}</td><td>${checked(d,'still')?pill('PUBLISHED'):pill(d.still.status)}<br>${esc(d.still.time)}</td><td>${pill(d.still.asset_status)}</td><td>${checked(d,'reel')?pill('PUBLISHED'):pill(d.reel.status)}<br>${esc(d.reel.time)}</td><td>${pill(d.reel.asset_status)}</td></tr>`).join('')}</tbody></table></div>`}
function renderBatch(){const a=DATA.batch_status||[];batchView.innerHTML=`<div class="panel body"><b>IMAGE PRODUCTION BATCHES — ${esc(DATA.brand||'')}</b></div>${a.map(x=>`<div class="batch"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(x.batch)} • ${esc(x.range)}</b><div style="color:var(--mut);font-size:12px">${esc(x.note)}</div></div>${pill(x.status)}</div><div class="bar"><i style="width:${x.total?Math.round((x.passed||0)/x.total*100):0}%"></i></div></div>`).join('')}`}
load();</script></body></html>
