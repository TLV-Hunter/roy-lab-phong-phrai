<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05090e"><title>RLS AI Studio Content Desk</title><style>
:root{--bg:#05090e;--p:#0a121b;--line:#173142;--cyan:#58d9ff;--txt:#e7f9ff;--mut:#7894a6;--g:#7de3a0;--a:#ffd477;--r:#ff9aa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 0,#0d2533,#05090e 42%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}header{position:sticky;top:0;z-index:10;background:#05090ef2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.top{max-width:1120px;margin:auto;padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand b{letter-spacing:1.5px}.brand small{display:block;color:var(--mut);margin-top:3px}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls select,.btn{background:#07131c;color:#dff8ff;border:1px solid #28506a;border-radius:9px;padding:8px 10px;font-weight:800;text-decoration:none}.btn.on{background:#0b3950;border-color:#49b5dd}.wrap{max-width:1120px;margin:auto;padding:14px}.view{display:none}.view.on{display:block}.mode{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#07131b;display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.mode span{color:var(--a);font-size:11px}.search{width:100%;background:#071019;border:1px solid #203a4b;color:var(--txt);padding:12px;border-radius:10px;margin-bottom:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card,.panel{background:linear-gradient(#0a121b,#071019);border:1px solid var(--line);border-radius:15px;overflow:hidden}.head{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:9px}.title b{font-size:18px}.title span{display:block;color:#79d8f4;font-size:11px;margin-top:2px}.tag{font-size:10px;border:1px solid #315167;border-radius:999px;padding:5px 7px;height:max-content}.body{padding:12px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.meta div{background:#07131b;border:1px solid #183244;border-radius:9px;padding:8px}.meta small{display:block;color:#6e899b;font-size:8px;letter-spacing:.8px}.meta strong{font-size:11px}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}.media{background:#03080c;border:1px solid #1b394b;border-radius:11px;overflow:hidden;margin-bottom:10px}.media img{display:block;width:100%;max-height:560px;object-fit:contain}.mediaTop{padding:9px 10px;border-bottom:1px solid #173142;display:flex;justify-content:space-between;gap:8px}.mediaTop small{color:var(--mut)}.mediaActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px}.imgbtn{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:8px;font-weight:800}.imgbtn.download{border-color:#446a45;background:#12311f;color:#bdf2c9}.media a{display:block;padding:10px;text-align:center;color:#86e1ff;text-decoration:none}.box{margin:10px 0}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.boxhead b{font-size:10px;letter-spacing:1px}.copy{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:6px 9px;font-weight:800}.text{white-space:pre-wrap;background:#061018;border:1px solid #1c3545;padding:10px;border-radius:9px;line-height:1.45;font-size:13px}.note{border-left:2px solid #3296ba;background:#07151e;color:#7895a8;padding:9px 10px;font-size:11px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:#071019;color:#9ab8c9;border:1px solid #254154;border-radius:8px;padding:8px;font-weight:800}.tabs button.on{background:#0c4057;color:#fff}.pane{display:none}.pane.on{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}.stat{padding:14px;background:#08131c;border:1px solid var(--line);border-radius:13px}.stat b{display:block;font-size:23px}.stat small{color:var(--mut)}.batch{padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:#08131c}.bar{height:7px;background:#14232d;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#4bcf84}.calendar{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:860px;background:#071019}th,td{padding:9px;border-bottom:1px solid #173142;text-align:left;vertical-align:top;font-size:11px}th{color:#7995a8;background:#09151e;letter-spacing:.8px}.pill{display:inline-block;border:1px solid #315167;border-radius:999px;padding:4px 7px;font-size:9px}.pill.pass,.pill.ready,.pill.scheduled,.pill.published,.pill.locked{color:var(--g);border-color:#2f6944}.pill.hold,.pill.waiting,.pill.pending{color:var(--a);border-color:#6d5c28}.pill.blocked,.pill.revise,.pill.rebuild{color:var(--r);border-color:#74404a}.checkrow{display:grid;grid-template-columns:54px 100px 1fr 130px 130px;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #173142;background:#071019}.checkrow.done{background:#07180f}.checkrow input{width:22px;height:22px;accent-color:#4bcf84}.checkrow b{font-size:12px}.checkrow small{display:block;color:var(--mut);font-size:10px}.doneText{color:var(--g);font-weight:900}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0a3041;border:1px solid #2d7593;color:#e5f9ff;padding:10px 14px;border-radius:10px;font-size:12px;z-index:99;display:none}.foot{text-align:center;color:#5f7a8c;font-size:10px;padding:22px}@media(max-width:760px){.cards{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.controls{width:100%}.controls select{flex:1}.wrap{padding:10px}.checkrow{grid-template-columns:46px 82px 1fr}.checkrow .hideMob{display:none}.mediaActions{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="top"><div class="brand"><b>RLS AI STUDIO CONTENT DESK</b><small>GitHub Pages • COLOSSUS + RLS • no extra login</small></div><div class="controls"><select id="campaign" onchange="switchCampaign(this.value)"><option value="colossus">COLOSSUS SIGNAL</option><option value="rls">RLS — รอยลับพงไพร</option></select><button class="btn on" data-v="desk">DESK</button><button class="btn" data-v="checklist">CHECKLIST</button><button class="btn" data-v="calendar">CALENDAR</button><button class="btn" data-v="batch">BATCH QA</button><a class="btn" id="publisherLink" href="./plan.html">PUBLISHER</a><button class="btn" onclick="load()">↻</button></div></div></header><main class="wrap"><div class="mode"><b id="brandName">Loading…</b><span id="modeText"></span></div><section id="desk" class="view on"><input id="q" class="search" placeholder="ค้นหา ID, title, caption..." oninput="renderDesk()"><div id="list" class="cards"></div></section><section id="checklist" class="view"><div id="checklistView"></div></section><section id="calendar" class="view"><div id="calendarView"></div></section><section id="batch" class="view"><div id="batchView"></div></section><div class="foot">Master Image + Caption + Pinned Comment + QA + Checklist + Calendar + Batch status อยู่ในเว็บเดียวกัน</div></main><div id="toast" class="toast"></div><script>
let DATA={episodes:[]},CAMPAIGN=localStorage.getItem('rls_desk_campaign')||'colossus',MEDIA=new Map();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cls=s=>{s=String(s||'').toLowerCase();return s.includes('pass')||s.includes('ready')||s.includes('scheduled')||s.includes('locked')||s.includes('published')?'g':s.includes('hold')||s.includes('wait')||s.includes('pending')?'a':'r'};function pill(s){let c=String(s||'').toLowerCase();c=c.includes('pass')?'pass':c.includes('ready')?'ready':c.includes('scheduled')?'scheduled':c.includes('published')?'published':c.includes('locked')?'locked':c.includes('blocked')?'blocked':c.includes('revise')?'revise':c.includes('rebuild')?'rebuild':c.includes('pending')?'pending':'waiting';return `<span class="pill ${c}">${esc(s||'—')}</span>`}function notify(s){toast.textContent=s;toast.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>toast.style.display='none',1400)}function switchCampaign(v){CAMPAIGN=v;localStorage.setItem('rls_desk_campaign',v);MEDIA.clear();load()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.v).classList.add('on')});async function load(){campaign.value=CAMPAIGN;publisherLink.style.display=CAMPAIGN==='colossus'?'inline-block':'none';const f=CAMPAIGN==='rls'?'./rls-content.json':'./content.json';try{DATA=await(await fetch(f+'?ts='+Date.now(),{cache:'no-store'})).json();brandName.textContent=DATA.brand||'';modeText.textContent=DATA.mode||'';renderDesk();renderChecklist();renderCalendar();renderBatch()}catch(e){list.innerHTML='<div class="note">โหลดข้อมูลไม่สำเร็จ • '+esc(e.message)+'</div>'}}
function box(title,text){return `<div class="box"><div class="boxhead"><b>${title}</b><button class="copy" onclick="copyBox(this)">COPY</button></div><div class="text">${esc(text||'')}</div></div>`}function media(ep,p){if(p.image_asset)return `<div class="media"><div class="mediaTop"><b>MASTER IMAGE • ORIGINAL ARCHIVE</b><small>${esc(p.image_asset.width)}×${esc(p.image_asset.height)}</small></div><div id="ml-${esc(ep.id)}" style="padding:28px;text-align:center;color:#7894a6">Loading Master Image...</div><img id="mi-${esc(ep.id)}" hidden alt="${esc(ep.id)} Master Image"><div class="mediaActions"><button class="imgbtn" onclick="copyImage('${esc(ep.id)}')">COPY IMAGE</button><button class="imgbtn download" onclick="downloadImage('${esc(ep.id)}')">DOWNLOAD JPG</button></div>${p.media_url?`<a href="${esc(p.media_url)}" target="_blank">OPEN ORIGINAL / DRIVE ↗</a>`:''}</div>`;if(p.preview_url)return `<div class="media"><img src="${esc(p.preview_url)}" alt="QA approved master">${p.media_url?`<a href="${esc(p.media_url)}" target="_blank">OPEN MASTER ASSET ↗</a>`:''}</div>`;if(p.media_url)return `<div class="media"><a href="${esc(p.media_url)}" target="_blank">OPEN QA-APPROVED MASTER IMAGE ↗</a></div>`;return''}function pane(ep,type){const p=ep[type]||{};return `<div class="pane ${type==='still'?'on':''} ${type}"><div class="meta"><div><small>STATUS</small><strong class="${cls(p.status)}">${esc(String(p.status||'—').toUpperCase())}</strong></div><div><small>POST TIME</small><strong>${esc(p.post_time||'—')}</strong></div><div><small>QA1</small><strong class="${cls(p.qa1)}">${esc(p.qa1||'—')}</strong></div><div><small>QA2</small><strong class="${cls(p.qa2)}">${esc(p.qa2||'—')}</strong></div></div>${type==='still'?media(ep,p):''}${box((type==='reel'?'REEL':'STILL')+' CAPTION',p.caption)}${box('FIRST / PINNED COMMENT',p.pinned_comment)}${p.planner_url?`<a style="color:#84dcff" href="${esc(p.planner_url)}" target="_blank">OPEN METRICOOL PLANNER ↗</a>`:''}</div>`}function starter(ep){const s=ep.starter;if(!s)return'';const approved=s.prompt_qa==='PASS'&&s.prompt;return `<div class="pane starter"><div class="meta"><div><small>FRAME QA</small><strong class="${cls(s.frame_qa)}">${esc(s.frame_qa||'—')}</strong></div><div><small>PROMPT QA</small><strong class="${cls(s.prompt_qa)}">${esc(s.prompt_qa||'—')}</strong></div><div><small>STATUS</small><strong class="${cls(s.status)}">${esc(String(s.status||'').toUpperCase())}</strong></div><div><small>FILE</small><strong>${esc(s.frame_filename||'—')}</strong></div></div>${approved?box('QA-APPROVED VIDEO PROMPT',s.prompt):'<div class="note">Prompt is not shown because Prompt QA has not passed yet.</div>'}</div>`}function renderDesk(){const q=(document.getElementById('q').value||'').toLowerCase();const a=(DATA.episodes||[]).filter(e=>JSON.stringify(e).toLowerCase().includes(q));list.innerHTML=a.length?a.map(e=>`<article class="card"><div class="head"><div class="title"><b>${esc(e.id)}</b><span>${esc(e.title||'')} • ${esc(e.batch||'')}</span></div><span class="tag">${esc(e.slot?'#'+e.slot:'AI INFO')}</span></div><div class="body"><div class="tabs"><button class="on" onclick="tab(this,'still')">STILL</button><button onclick="tab(this,'reel')">REEL</button>${e.starter?'<button onclick="tab(this,\'starter\')">STARTER</button>':''}</div>${pane(e,'still')}${pane(e,'reel')}${starter(e)}<div class="note">${esc(e.note||'')}</div></div></article>`).join(''):'<div class="note">ไม่พบ Content</div>';a.filter(e=>e.still&&e.still.image_asset).forEach(e=>loadMaster(e.id).catch(()=>{}))}function tab(b,t){const c=b.closest('.card');c.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');c.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));c.querySelector('.'+t).classList.add('on')}function copyBox(b){const t=b.closest('.box').querySelector('.text').innerText;navigator.clipboard?.writeText(t).then(()=>{const o=b.textContent;b.textContent='COPIED ✓';setTimeout(()=>b.textContent=o,800)}).catch(()=>prompt('Copy:',t))}
function checklistKey(x){return 'desk_posted_'+CAMPAIGN+'_'+x.date+'_'+x.title}function isChecked(x){if(x.posted===true||String(x.publish_status).toUpperCase()==='PUBLISHED')return true;return localStorage.getItem(checklistKey(x))==='1'}function toggleCheck(i,checked){const x=(DATA.calendar||[])[i];if(!x)return;localStorage.setItem(checklistKey(x),checked?'1':'0');renderChecklist();renderCalendar()}function renderChecklist(){const a=DATA.calendar||[],done=a.filter(isChecked).length;checklistView.innerHTML=`<div class="panel body"><div class="title"><b>${esc(DATA.brand||'')} — POST CHECKLIST</b></div><p style="color:var(--mut)">โพสต์แล้ว ${done}/${a.length} รายการ • ติ๊กสถานะในเบราว์เซอร์นี้ได้</p></div><div class="panel">${a.map((x,i)=>{const d=isChecked(x);return `<div class="checkrow ${d?'done':''}"><div><input type="checkbox" ${d?'checked':''} onchange="toggleCheck(${i},this.checked)"></div><div><b>${esc(x.date)}</b><small>${esc(x.time)}</small></div><div><b>${esc(x.title)}</b><small>${esc(x.format)}</small></div><div class="hideMob">${pill(x.asset_status)}</div><div class="hideMob">${d?'<span class="doneText">✓ POSTED</span>':pill(x.publish_status)}</div></div>`}).join('')}</div>`}function renderCalendar(){const a=DATA.calendar||[];calendarView.innerHTML=`<div class="panel body"><div class="title"><b>${esc(DATA.brand||'')} — CONTENT CALENDAR</b></div><p style="color:var(--mut)">Timezone: ${esc(DATA.timezone||'Asia/Bangkok')} • ${esc(DATA.mode||'')}</p></div>${a.length?`<div class="calendar"><table><thead><tr><th>Date</th><th>Time</th><th>Format</th><th>Story</th><th>Asset</th><th>Publish</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.date)}</b></td><td>${esc(x.time)}</td><td>${esc(x.format)}</td><td>${esc(x.title)}</td><td>${pill(x.asset_status)}</td><td>${isChecked(x)?pill('PUBLISHED'):pill(x.publish_status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel body">No calendar data yet.</div>'}`}function renderBatch(){const a=DATA.batch_status||[];batchView.innerHTML=a.length?`<div class="stats">${a.slice(0,3).map(x=>`<div class="stat"><small>${esc(x.batch)}</small><b>${esc(x.passed||0)}/${esc(x.total||0)}</b><span class="${cls(x.status)}">${esc(x.status)}</span></div>`).join('')}</div>${a.map(x=>`<div class="batch"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(x.batch)} • ${esc(x.range)}</b><div style="color:var(--mut);font-size:12px">${esc(x.note)}</div>${x.generated!=null?`<div style="color:#7fa0b2;font-size:11px">Generated ${esc(x.generated)}/${esc(x.total)}</div>`:''}</div>${pill(x.status)}</div><div class="bar"><i style="width:${x.total?Math.round((x.passed||0)/x.total*100):0}%"></i></div></div>`).join('')}`:'<div class="panel body">No batch QA data yet.</div>'}
async function getMedia(id){if(MEDIA.has(id))return MEDIA.get(id);const ep=(DATA.episodes||[]).find(e=>e.id===id),a=ep?.still?.image_asset;if(!a)throw Error('no asset');let chunks=[];for(let i=1;i<=a.parts;i++){let n=String(i).padStart(2,'0'),r=await fetch(`${a.base_path}part${n}.txt?ts=${DATA.updated_at||''}`,{cache:'force-cache'});if(!r.ok)throw Error('part '+n);chunks.push((await r.text()).trim())}let bin=atob(chunks.join('')),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);let blob=new Blob([bytes],{type:a.mime||'image/avif'}),url=URL.createObjectURL(blob),m={blob,url,asset:a};MEDIA.set(id,m);return m}async function loadMaster(id){let m=await getMedia(id),img=document.getElementById('mi-'+id),l=document.getElementById('ml-'+id);if(img){img.src=m.url;img.onload=()=>{img.hidden=false;if(l)l.style.display='none'}}}async function imageCanvas(id){let m=await getMedia(id),x=new Image();await new Promise((res,rej)=>{x.onload=res;x.onerror=rej;x.src=m.url});let c=document.createElement('canvas');c.width=x.naturalWidth;c.height=x.naturalHeight;c.getContext('2d').drawImage(x,0,0);return c}async function copyImage(id){try{let c=await imageCanvas(id),png=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);notify('COPY IMAGE ✓ '+id)}catch(e){notify('Copy ไม่สำเร็จ • ใช้ Download แทน')}}async function downloadImage(id){try{let ep=(DATA.episodes||[]).find(e=>e.id===id),c=await imageCanvas(id),jpg=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),'image/jpeg',0.96)),u=URL.createObjectURL(jpg),a=document.createElement('a');a.href=u;a.download=ep.still.image_asset.filename||id+'_MASTER.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);notify('DOWNLOAD ✓ '+id)}catch(e){notify('Download ไม่สำเร็จ')}}load();
</script></body></html>
