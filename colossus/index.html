<style>
:root{--b:#05090e;--p:#09131c;--p2:#061018;--l:#173142;--c:#58d9ff;--t:#e9faff;--m:#7894a6;--g:#76efa2;--a:#ffd477;--r:#ff9aa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#0e2b3b,#05090e 42%);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea,a{font:inherit}button{cursor:pointer}.top,.wrap{max-width:1760px;margin:auto}.top{padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.brand a{color:#dff8ff;text-decoration:none;font-weight:900}.brand small{display:block;color:var(--m);font-size:10px}.controls,.toolbar,.navrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn,.controls select,.toolbar select{background:#07131c;color:#dff8ff;border:1px solid #28506a;border-radius:9px;padding:8px 10px;font-weight:800;text-decoration:none}.btn.on{background:#0b4058;color:#fff}.controls select{min-width:195px}.wrap{padding:14px}.view{display:none}.view.on{display:block}.panel,.mode,.episode,.slot{background:linear-gradient(#0a121b,#071019);border:1px solid var(--l);border-radius:14px}.mode,.panel{padding:11px 13px;margin-bottom:12px}.mode b{font-size:14px}.mode small{display:block;color:var(--a);margin-top:3px}.toolbar select{min-width:470px;max-width:100%}.statusline{color:#bff2ff;font-size:11px;margin-top:8px}.search{width:100%;background:#071019;border:1px solid #203a4b;color:#fff;padding:11px;border-radius:10px;margin:10px 0}.episodes{display:grid;gap:14px}.episode{overflow:hidden}.ephead{padding:12px 14px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ephead h2{margin:0;font-size:19px}.date{color:var(--c);font-size:11px;margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-block;border:1px solid #315167;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;white-space:nowrap}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}.slot{overflow:hidden;min-width:0}.slothead{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--l);background:#07131b}.slothead b{font-size:13px}.viewer{height:68vh;min-height:560px;max-height:900px;background:#020609;display:flex;align-items:center;justify-content:center;position:relative}.viewer iframe,.viewer video,.viewer img.assetimg{width:100%;height:100%;border:0;background:#020609}.viewer video,.viewer img.assetimg{object-fit:contain}.viewer img.assetimg{display:block;user-select:auto;-webkit-user-drag:auto}.waiting{padding:28px;text-align:center;color:#6f8da0;line-height:1.7}.waiting b{display:block;color:var(--a);font-size:16px;margin-bottom:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px}.actions.imageactions{grid-template-columns:repeat(3,1fr)}.actions a,.actions button{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:8px;text-align:center;text-decoration:none;font-size:10px;font-weight:800}.copybox{padding:0 8px 8px}.copyhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0 5px}.copyhead button{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:800}.text{white-space:pre-wrap;background:#061018;border:1px solid #1c3545;padding:10px;border-radius:9px;line-height:1.48;font-size:12px;min-height:64px}.pending{padding:10px;border:1px dashed #5a4d20;background:#171408;color:#ffe49a;border-radius:9px;font-size:11px}.all .viewer{height:430px;min-height:430px}.all .three{grid-template-columns:repeat(3,minmax(0,1fr))}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:9px;border-bottom:1px solid var(--l);text-align:left;font-size:11px}.tablewrap{overflow:auto}.batchgrid,.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.batchcard,.metric{background:#071019;border:1px solid var(--l);border-radius:11px;padding:11px}.metric input,.metric textarea{width:100%;margin-top:6px;background:#050d13;color:white;border:1px solid #23475b;border-radius:7px;padding:7px}.metric textarea{min-height:80px}.strategygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv{border-bottom:1px solid #173142;padding:8px 0}.kv b{color:#bfefff}.hint{font-size:11px;color:var(--a);margin-top:8px}@media(max-width:1350px){.three,.all .three{grid-template-columns:1fr 1fr}.slot.reelslot{grid-column:1/3}.viewer{height:64vh;min-height:520px}}@media(max-width:850px){.three,.all .three{grid-template-columns:1fr}.slot.reelslot{grid-column:auto}.viewer,.all .viewer{height:68vh;min-height:430px}.toolbar select{min-width:0;width:100%}.toolbar .btn{flex:1}.batchgrid,.metricgrid,.strategygrid{grid-template-columns:1fr}.ephead{flex-direction:column}.badges{justify-content:flex-start}.controls{width:100%}.controls .btn,.controls select{flex:1}.actions.imageactions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><a href="../">🏠 HOME</a><div><b>RLS AI STUDIO CONTENT DESK</b><small>COLOSSUS + RLS • one workspace</small></div></div><div class="controls"><select id="campaign"><option value="colossus">COLOSSUS SIGNAL</option><option value="rls">RLS — รอยลับพงไพร</option></select><button class="btn on" data-view="desk">DESK</button><button class="btn" data-view="checklist">CHECKLIST</button><button class="btn" data-view="calendar">CALENDAR</button><button class="btn" data-view="batch">BATCH QA</button><button class="btn" data-view="strategy">STRATEGY</button><button class="btn" data-view="performance">PERFORMANCE</button><a class="btn" id="publisherLink" href="./plan.html">PUBLISHER</a></div></div></header>
<main class="wrap">
<div class="mode"><b id="brandName"></b><small id="modeText"></small></div>
<section id="desk" class="view on"><div id="deskToolbar"></div><div id="deskList" class="episodes"></div></section>
<section id="checklist" class="view"><div class="panel"><b>CHECKLIST</b><div id="checklistView" class="tablewrap"></div></div></section>
<section id="calendar" class="view"><div class="panel"><b>CALENDAR</b><div id="calendarView" class="tablewrap"></div></div></section>
<section id="batch" class="view"><div class="panel"><b>BATCH QA</b><div id="batchView" class="batchgrid" style="margin-top:10px"></div></div></section>
<section id="strategy" class="view"><div class="panel"><b>STRATEGY</b><div id="strategyView" class="strategygrid" style="margin-top:10px"></div></div></section>
<section id="performance" class="view"><div class="panel"><b>PERFORMANCE NOTES</b><div id="performanceView"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let C={},R={},S={entries:[]},Q={entries:[]},CS={entries:[]},CR={entries:[]},CAM=localStorage.getItem('rls_desk_campaign')||'rls',MODE='single';
function pass(v){return /pass|locked|published|scheduled/i.test(String(v||''))}
function cls(v){v=String(v||'').toLowerCase();return /pass|ready|locked|published/.test(v)?'g':/pending|planned|waiting|scheduled|next/.test(v)?'a':'r'}
function driveId(u){return(String(u||'').match(/\/d\/([^/]+)/)||[])[1]||''}
function driveView(u){let id=driveId(u);return id?`https://drive.google.com/file/d/${id}/preview`:u||''}
function driveDl(u){let id=driveId(u);return id?`https://drive.google.com/uc?export=download&id=${id}`:u||''}
function driveImg(u){let id=driveId(u);return id?`https://lh3.googleusercontent.com/d/${id}=w4096`:u||''}
function driveImgAlt(u){let id=driveId(u);return id?`https://drive.google.com/thumbnail?id=${id}&sz=w4096`:u||''}
function copyEntry(id){return(Q.entries||[]).find(x=>x.id===id)||{}}
function starterEntry(id){return(S.entries||[]).find(x=>x.id===id)||{}}
function colStarterEntry(id){return(CS.entries||[]).find(x=>x.id===id)||{}}
function colReelEntry(id){return(CR.entries||[]).find(x=>x.id===id)||{}}
function source(){return CAM==='rls'?R:C}
function eps(){return(source().episodes||[]).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')))}
function syncPublisher(){let a=$('publisherLink');if(a)a.href=CAM==='rls'?'./rls-daily-queue.html':'./plan.html'}
function copyBlock(title,text,qa,key){if(!pass(qa))return `<div class="copybox"><div class="copyhead"><b>${title}</b><span class="pill a">COPY QA PENDING</span></div><div class="pending">ซ่อนข้อความไว้จนกว่า COPY QA จะ PASS</div></div>`;return `<div class="copybox"><div class="copyhead"><b>${title}</b><button onclick="copyText('${key}')">COPY</button></div><div class="text" id="${key}">${esc(text||'')}</div></div>`}
window.copyText=async id=>{let t=$(id)?.innerText||'';try{await navigator.clipboard.writeText(t)}catch{prompt('Copy:',t)}};
window.imageFallback=img=>{let alt=img.dataset.alt||'';if(img.dataset.tried!=='1'&&alt){img.dataset.tried='1';img.src=alt;return}img.style.display='none';let f=img.nextElementSibling;if(f)f.style.display='block'};
window.copyImage4K=async(u,btn)=>{let src=driveImg(u),old=btn.textContent;try{let res=await fetch(src,{mode:'cors',cache:'no-store'});if(!res.ok)throw new Error('fetch');let blob=await res.blob();let bmp=await createImageBitmap(blob),c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;c.getContext('2d').drawImage(bmp,0,0);let png=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('png')),'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);btn.textContent='COPIED IMAGE ✓';setTimeout(()=>btn.textContent=old,1200)}catch(e){let w=window.open(src,'_blank');btn.textContent='OPENED FOR COPY';setTimeout(()=>btn.textContent=old,1400);if(!w)alert('เบราว์เซอร์บล็อกการ Copy image อัตโนมัติ — กด OPEN 4K ORIGINAL หรือ DOWNLOAD 4K ได้ตามเดิม')}};
function imageSlot(title,u,qa,id,kind,copyHtml){let has=!!u,img=driveImg(u),alt=driveImgAlt(u),view=driveView(u);return `<div class="slot"><div class="slothead"><b>${title}</b><span class="pill ${cls(qa)}">${esc(qa||'—')}</span></div><div class="viewer">${has?`<img class="assetimg" src="${esc(img)}" data-alt="${esc(alt)}" data-tried="0" alt="${esc(id+' '+kind)}" loading="${MODE==='single'?'eager':'lazy'}" onerror="imageFallback(this)"><iframe src="${esc(view)}" allow="autoplay" style="display:none"></iframe>`:`<div class="waiting"><b>4K ASSET NOT READY</b>ยังไม่มีไฟล์ Final สำหรับช่องนี้</div>`}</div><div class="actions imageactions">${has?`<a href="${esc(u)}" target="_blank">OPEN 4K ORIGINAL</a><a href="${esc(driveDl(u))}" target="_blank">DOWNLOAD 4K</a><button onclick="copyImage4K('${esc(u)}',this)">COPY IMAGE</button>`:`<span></span><span></span><span></span>`}</div>${copyHtml||''}</div>`}
function reelSlot(e,cp){let r=e.reel||{},u=r.media_url||r.final_media_url||'',q=cp.reel?.copy_qa||r.copy_qa||'',label=r.resolution?`REEL • FINAL ${r.resolution}`:'REEL • FINAL';let media=u?`<iframe src="${esc(driveView(u))}" allow="autoplay"></iframe>`:`<div class="waiting"><b>FINAL REEL NOT YET UPLOADED</b>Caption / pinned comment จะแสดงได้ถ้า COPY QA ผ่านแล้ว<br>เมื่ออัป Final Reel ระบบจะใช้ช่องนี้แสดงวิดีโอ Final</div>`;return `<div class="slot reelslot"><div class="slothead"><b>${esc(label)}</b><span class="pill ${cls(r.status||'waiting')}">${esc((r.status||'WAITING').toUpperCase())}</span></div><div class="viewer">${media}</div><div class="actions">${u?`<a href="${esc(u)}" target="_blank">OPEN FINAL REEL</a><a href="${esc(driveDl(u))}" target="_blank">DOWNLOAD FINAL</a>`:`<span></span><span></span>`}</div>${copyBlock('REEL CAPTION',cp.reel?.caption||r.caption,q,'rcap-'+e.id)}${copyBlock('REEL PINNED COMMENT',cp.reel?.comment||r.pinned_comment,q,'rpin-'+e.id)}</div>`}
function colReelSlot(e){let r=colReelEntry(e.id),u=r.media_url||'',q=r.copy_qa||'',media=u?`<iframe src="${esc(driveView(u))}" allow="autoplay"></iframe>`:`<div class="waiting"><b>FINAL REEL NOT YET UPLOADED</b>เมื่อ Final Reel ผ่าน QA และอัปโหลดแล้ว ระบบจะแสดงในช่องนี้</div>`;return `<div class="slot reelslot"><div class="slothead"><b>REEL • FINAL</b><span class="pill ${cls(r.status||'waiting')}">${esc((r.status||'WAITING').toUpperCase())}${r.qa?' • '+esc(r.qa):''}</span></div><div class="viewer">${media}</div><div class="actions">${u?`<a href="${esc(u)}" target="_blank">OPEN FINAL REEL</a><a href="${esc(driveDl(u))}" target="_blank">DOWNLOAD FINAL</a>`:`<span></span><span></span>`}</div>${copyBlock('REEL CAPTION',r.caption,q,'crcap-'+e.id)}${copyBlock('REEL FIRST COMMENT',r.pinned_comment,q,'crpin-'+e.id)}</div>`}
function rlsCard(e){let st=e.still||{},se=starterEntry(e.id),cp=copyEntry(e.id),sq=se.starter_qa||'',pq=se.prompt_qa||'',mq=st.qa1||st.qa2||st.status||'',mcq=cp.still?.copy_qa||st.copy_qa||'';let master=imageSlot('MASTER STILL • 4K',st.media_url,mq,e.id,'master',copyBlock('MASTER CAPTION',cp.still?.caption||st.caption,mcq,'mcap-'+e.id)+copyBlock('MASTER PINNED COMMENT',cp.still?.comment||st.pinned_comment,mcq,'mpin-'+e.id));let starter=imageSlot('STARTER FRAME • 4K',se.starter_url,sq,e.id,'starter',copyBlock('REEL VIDEO PROMPT',se.prompt,pq,'prompt-'+e.id));return `<article class="episode"><div class="ephead"><div><h2>${esc(e.id)} — ${esc(e.title||'')}</h2><div class="date">${esc(e.date||'')} • ${esc(e.phase||'')}</div></div><div class="badges"><span class="pill ${cls(mq)}">MASTER ${esc(mq||'—')}</span><span class="pill ${cls(sq)}">STARTER ${esc(sq||'—')}</span><span class="pill ${cls(pq)}">PROMPT ${esc(pq||'—')}</span></div></div><div class="three">${master}${starter}${reelSlot(e,cp)}</div></article>`}
function colCard(e){let st=e.still||{},se=colStarterEntry(e.id),sq=se.starter_qa||'',pq=se.prompt_qa||'',mq=st.qa1||st.qa2||st.status||'',mcq=st.copy_qa||'PASS';let master=imageSlot('MASTER STILL • 4K',st.media_url,mq,e.id,'master',copyBlock('STILL CAPTION',st.caption,mcq,'ccap-'+e.id)+copyBlock('FIRST COMMENT',st.pinned_comment,mcq,'cpin-'+e.id));let starter=imageSlot('STARTER FRAME',se.starter_url,sq,e.id,'starter',copyBlock('REEL VIDEO PROMPT',se.prompt,pq,'cprompt-'+e.id));return `<article class="episode"><div class="ephead"><div><h2>${esc(e.id)} — ${esc(e.title||'')}</h2><div class="date">${esc(e.date||'')} • COLOSSUS SIGNAL</div></div><div class="badges"><span class="pill ${cls(mq)}">MASTER ${esc(mq||'—')}</span><span class="pill ${cls(sq)}">STARTER ${esc(sq||'—')}</span><span class="pill ${cls(pq)}">PROMPT ${esc(pq||'—')}</span></div></div><div class="three">${master}${starter}${colReelSlot(e)}</div></article>`}
function setupDesk(a,isRls){let key=isRls?'rls_desk_episode':'colossus_desk_episode',fallback=isRls?'RLS-002':'CS-005',saved=localStorage.getItem(key),sel=(saved&&a.some(x=>x.id===saved))?saved:(a.find(x=>x.id===fallback)?.id||a[0]?.id||'');$('deskToolbar').innerHTML=`<div class="panel"><div class="toolbar"><select id="episodeSel">${a.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.date||'')} • ${esc(x.id)} • ${esc(x.title||'')}</option>`).join('')}</select><button class="btn" id="prev">← ก่อนหน้า</button><button class="btn" id="next">ถัดไป →</button><button class="btn on" id="one">ดู 1 วัน</button><button class="btn" id="all">ดูทั้งหมด</button></div><input id="search" class="search" placeholder="${isRls?'ค้นหา RLS / วันที่ / title':'ค้นหา CS / วันที่ / title'}"><div class="statusline">DESK เดียว: MASTER STILL + STARTER + REEL • แสดง Copy/Prompt เฉพาะที่ QA PASS • Media ใช้ไฟล์ Original/4K เมื่อมี</div></div>`;let draw=()=>{let q=$('search').value.toLowerCase(),chosen=$('episodeSel').value;localStorage.setItem(key,chosen);let rows=MODE==='all'?a.filter(x=>JSON.stringify(x).toLowerCase().includes(q)):a.filter(x=>x.id===chosen);$('deskList').className=MODE==='all'?'episodes all':'episodes';$('deskList').innerHTML=rows.map(isRls?rlsCard:colCard).join('')};$('episodeSel').onchange=()=>{MODE='single';$('one').classList.add('on');$('all').classList.remove('on');draw()};$('search').oninput=draw;$('one').onclick=()=>{MODE='single';$('one').classList.add('on');$('all').classList.remove('on');draw()};$('all').onclick=()=>{MODE='all';$('all').classList.add('on');$('one').classList.remove('on');draw()};function move(n){let i=a.findIndex(x=>x.id===$('episodeSel').value);if(i<0)return;i=(i+n+a.length)%a.length;$('episodeSel').value=a[i].id;MODE='single';$('one').classList.add('on');$('all').classList.remove('on');draw();scrollTo({top:0,behavior:'smooth'})}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);draw()}
function renderDesk(){let a=eps();$('brandName').textContent=source().brand||(CAM==='rls'?'RLS — รอยลับพงไพร / THE HIDDEN FOREST':'COLOSSUS SIGNAL');$('modeText').textContent=source().mode||'';setupDesk(a,CAM==='rls')}
function renderChecklist(){let a=eps();$('checklistView').innerHTML=`<table><thead><tr><th>ID</th><th>DATE</th><th>MASTER</th><th>MASTER COPY</th><th>STARTER</th><th>PROMPT</th><th>REEL COPY</th><th>FINAL REEL</th></tr></thead><tbody>${a.map(e=>{let st=e.still||{},r=e.reel||{},cp=CAM==='rls'?copyEntry(e.id):{},se=CAM==='rls'?starterEntry(e.id):colStarterEntry(e.id),rr=CAM==='rls'?r:colReelEntry(e.id),masterCopy=CAM==='rls'?(cp.still?.copy_qa||st.copy_qa):(st.copy_qa||'PASS'),reelCopy=CAM==='rls'?(cp.reel?.copy_qa||r.copy_qa):(rr.copy_qa||'—'),finalReady=CAM==='rls'?!!r.media_url:!!rr.media_url;return `<tr><td><b>${esc(e.id)}</b></td><td>${esc(e.date||'')}</td><td class="${cls(st.qa1||st.status)}">${esc(st.qa1||st.status||'—')}</td><td class="${cls(masterCopy)}">${esc(masterCopy||'—')}</td><td class="${cls(se.starter_qa)}">${esc(se.starter_qa||'—')}</td><td class="${cls(se.prompt_qa)}">${esc(se.prompt_qa||'—')}</td><td class="${cls(reelCopy)}">${esc(reelCopy)}</td><td class="${finalReady?'g':'a'}">${finalReady?'READY':'WAITING'}</td></tr>`}).join('')}</tbody></table>`}
function renderCalendar(){let a=eps();$('calendarView').innerHTML=`<table><thead><tr><th>DATE</th><th>ID</th><th>TITLE</th><th>STILL TIME</th><th>REEL TIME</th><th>STATUS</th></tr></thead><tbody>${a.map(e=>{let rr=CAM==='rls'?(e.reel||{}):colReelEntry(e.id);return `<tr><td>${esc(e.date||'')}</td><td><b>${esc(e.id)}</b></td><td>${esc(e.title||'')}</td><td>${esc(e.still?.post_time||e.schedule?.linked_still||'—')}</td><td>${esc(e.reel?.post_time||e.schedule?.reel||'—')}</td><td>${esc(e.still?.status||'—')} / ${esc(rr.status||e.reel?.status||'—')}</td></tr>`}).join('')}</tbody></table>`}
function renderBatch(){let b=source().batch_status||[];$('batchView').innerHTML=b.map(x=>`<div class="batchcard"><b>${esc(x.batch||'BATCH')}</b><div class="date">${esc(x.range||'')}</div><p class="${cls(x.status)}"><b>${esc(x.status||'')}</b></p><div>${esc(x.passed??0)} / ${esc(x.total??0)} PASS</div><small style="color:var(--m)">${esc(x.note||'')}</small></div>`).join('')||'<div class="batchcard">No batch data</div>'}
function renderStrategy(){$('strategyView').innerHTML=CAM==='rls'?`<div class="batchcard"><b>RLS CURRENT DIRECTION</b><div class="kv"><b>Core</b><span>Evidence Before Explanation</span></div><div class="kv"><b>Mix</b><span>Evidence Mystery 45% • Creature 30% • Uncanny 25%</span></div><div class="kv"><b>Audience</b><span>International-first • Public copy English</span></div></div><div class="batchcard"><b>PRODUCTION LOCKS</b><div class="kv"><b>Still</b><span>24/24 QA PASS</span></div><div class="kv"><b>Starter</b><span>24/24 QA PASS</span></div><div class="kv"><b>Prompt</b><span>24/24 QA PASS</span></div><div class="kv"><b>Final Reels</b><span>Generate + QA + upload next</span></div></div>`:`<div class="batchcard"><b>COLOSSUS SIGNAL</b><div class="kv"><b>Core</b><span>Awe Before Fear • Scale Before Exposition</span></div><div class="kv"><b>Audience</b><span>Global / foreign-market first</span></div><div class="kv"><b>Workflow</b><span>Master Still → Starter → Prompt → Final Reel → Publish</span></div></div><div class="batchcard"><b>CURRENT PRODUCTION</b><div class="kv"><b>CS-005</b><span>${esc(colReelEntry('CS-005').status||'—')}</span></div><div class="kv"><b>CS-006</b><span>${esc(colReelEntry('CS-006').status||'—')}</span></div></div>`}
function renderPerformance(){let a=eps();$('performanceView').innerHTML=`<div class="metricgrid"><div class="metric"><small>EPISODE</small><select id="perfEp" style="width:100%;margin-top:6px;background:#050d13;color:white;border:1px solid #23475b;border-radius:7px;padding:7px">${a.map(e=>`<option>${esc(e.id)}</option>`).join('')}</select></div><div class="metric"><small>VIEWS</small><input id="pv" type="number"></div><div class="metric"><small>SHARES</small><input id="ps" type="number"></div><div class="metric"><small>FOLLOWS</small><input id="pf" type="number"></div><div class="metric"><small>AVG WATCH / SEC</small><input id="pw" type="number" step="0.1"></div><div class="metric"><small>NOTES</small><textarea id="pn"></textarea></div></div><div class="navrow" style="margin-top:10px"><button class="btn" id="savePerf">SAVE LOCAL</button></div>`;let load=()=>{let k=`perf_${CAM}_${$('perfEp').value}`,d=JSON.parse(localStorage.getItem(k)||'{}');$('pv').value=d.v||'';$('ps').value=d.s||'';$('pf').value=d.f||'';$('pw').value=d.w||'';$('pn').value=d.n||''};$('perfEp').onchange=load;$('savePerf').onclick=()=>{let k=`perf_${CAM}_${$('perfEp').value}`;localStorage.setItem(k,JSON.stringify({v:$('pv').value,s:$('ps').value,f:$('pf').value,w:$('pw').value,n:$('pn').value}));alert('Saved')};load()}
function renderAll(){syncPublisher();renderDesk();renderChecklist();renderCalendar();renderBatch();renderStrategy();renderPerformance()}
$('campaign').value=CAM;$('campaign').onchange=e=>{CAM=e.target.value;localStorage.setItem('rls_desk_campaign',CAM);MODE='single';renderAll()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(b.dataset.view).classList.add('on')});
const getJson=u=>fetch(u+'?v='+Date.now()).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()});
Promise.all([getJson('./content.json'),getJson('./rls-content.json'),getJson('./rls-starters.json'),getJson('./rls-copy-qa.json'),getJson('./colossus-starters.json').catch(()=>({entries:[]})),getJson('./colossus-reels.json').catch(()=>({entries:[]}))]).then(([c,r,s,q,cs,cr])=>{C=c;R=r;S=s;Q=q;CS=cs;CR=cr;renderAll()}).catch(e=>{$('deskList').innerHTML=`<div class="panel r">LOAD ERROR: ${esc(e.message)}</div>`});
</script>
</body></html>
