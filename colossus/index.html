<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05090e"><title>RLS AI Studio Content Desk</title>
<style>
:root{--b:#05090e;--p:#0a121b;--l:#173142;--c:#58d9ff;--t:#e7f9ff;--m:#7894a6;--g:#7de3a0;--a:#ffd477;--r:#ff9aa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 0,#0d2533,#05090e 42%);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,a{font:inherit}button{cursor:pointer}.top,.wrap{max-width:1240px;margin:auto}.top{padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand a{color:#dff8ff;text-decoration:none;font-weight:900}.brand small{display:block;color:var(--m);font-size:11px}.controls{display:flex;gap:7px;flex-wrap:wrap}.btn,.controls select{background:#07131c;color:#dff8ff;border:1px solid #28506a;border-radius:9px;padding:8px 10px;font-weight:800;text-decoration:none}.btn.on{background:#0b3950}.wrap{padding:14px}.view{display:none}.view.on{display:block}.mode,.rule,.card,.batch,.panel{background:linear-gradient(#0a121b,#071019);border:1px solid var(--l);border-radius:14px}.mode,.rule,.panel{padding:11px 13px;margin-bottom:12px}.rule{color:#bff2ff}.search{width:100%;background:#071019;border:1px solid #203a4b;color:#fff;padding:11px;border-radius:10px;margin-bottom:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{overflow:hidden}.head{padding:12px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:10px}.body{padding:12px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:#071019;color:#9ab8c9;border:1px solid #254154;border-radius:8px;padding:8px;font-weight:800}.tabs button.on{background:#0c4057;color:white}.pane{display:none}.pane.on{display:block}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.meta div{background:#07131b;border:1px solid #183244;border-radius:9px;padding:8px}.meta small{display:block;color:#6e899b;font-size:8px}.media{background:#03080c;border:1px solid #1b394b;border-radius:11px;overflow:hidden;margin-bottom:10px}.driveFrame{width:100%;height:520px;border:0;background:#03080c}.mediaActions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px}.mediaActions a,.mediaActions button{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:8px;text-align:center;text-decoration:none;font-size:11px;font-weight:800}.box{margin:10px 0}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.copy{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:6px 9px;font-weight:800}.text{white-space:pre-wrap;background:#061018;border:1px solid #1c3545;padding:10px;border-radius:9px;line-height:1.45;font-size:13px}.pill{display:inline-block;border:1px solid #315167;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}.phase{color:var(--c);font-size:10px;margin-top:3px}.daily{display:grid;gap:10px}.day{display:grid;grid-template-columns:108px 138px minmax(240px,1fr) 190px;gap:12px;align-items:center;border:1px solid var(--l);background:#071019;border-radius:14px;padding:12px}.previewWrap{width:120px;height:160px;border:1px solid #24475a;border-radius:10px;background:#03080c;overflow:hidden;display:flex;align-items:center;justify-content:center}.previewWrap img{width:100%;height:100%;object-fit:cover;display:block}.thumbPending{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#638194;font-size:10px;padding:8px;background:linear-gradient(145deg,#08131b,#03080c)}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.quick a{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:6px 8px;text-decoration:none;font-size:10px;font-weight:800}.stack{display:grid;gap:7px}.calendar{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid var(--l);text-align:left;font-size:11px}.batch{padding:12px;margin-bottom:9px}.strategyGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px;border-bottom:1px solid #132b39;padding:7px 0}.kv b{color:#bfefff}.test{padding:11px;border:1px solid #173142;background:#071019;border-radius:11px;margin-top:8px}.metricGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.metric{background:#071019;border:1px solid #173142;border-radius:10px;padding:10px}.metric small{display:block;color:var(--m)}.metric input{width:100%;margin-top:6px;background:#050d13;color:#fff;border:1px solid #23475b;border-radius:7px;padding:7px}.warn{border-left:3px solid var(--a);padding:9px 10px;background:#1b1708;color:#ffe79f;border-radius:0 8px 8px 0;margin:8px 0}@media(max-width:900px){.cards,.strategyGrid{grid-template-columns:1fr}.metricGrid{grid-template-columns:1fr 1fr}.day{grid-template-columns:95px 120px 1fr}.day>.stack{grid-column:2/4}.mediaActions{grid-template-columns:1fr 1fr}.previewWrap{width:110px;height:146px}}@media(max-width:620px){.controls{width:100%}.btn,.controls select{flex:1}.meta{grid-template-columns:1fr 1fr}.driveFrame{height:420px}.metricGrid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.day{grid-template-columns:1fr}.day>.stack{grid-column:auto}.previewWrap{width:150px;height:215px}.mediaActions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><a href="../">🏠 HOME</a><div><b>RLS AI STUDIO CONTENT DESK</b><small>COLOSSUS + RLS • one workspace</small></div></div><div class="controls"><select id="campaign"><option value="colossus">COLOSSUS SIGNAL</option><option value="rls">RLS — รอยลับพงไพร</option></select><button class="btn on" data-v="desk">DESK</button><button class="btn" data-v="checklist">CHECKLIST</button><button class="btn" data-v="calendar">CALENDAR</button><button class="btn" data-v="batch">BATCH QA</button><button class="btn" data-v="strategy">STRATEGY</button><button class="btn" data-v="performance">PERFORMANCE</button><a class="btn" id="publisherLink" href="./plan.html">PUBLISHER</a></div></div></header>
<main class="wrap"><div class="mode"><b id="brandName"></b><div id="modeText" style="color:var(--a);font-size:11px"></div></div><div id="dailyRule" class="rule"></div><section id="desk" class="view on"><input id="q" class="search" placeholder="ค้นหา Episode / title / caption"><div id="list" class="cards"></div></section><section id="checklist" class="view"><div class="panel"><b>CHECKLIST + MASTER PREVIEW</b><div class="phase">Thumbnail อยู่บนเว็บเอง ไม่พึ่ง Google Drive preview • Reel 08:30 / Still 20:30</div></div><div id="checklistView"></div></section><section id="calendar" class="view"><div id="calendarView"></div></section><section id="batch" class="view"><div id="batchView"></div></section><section id="strategy" class="view"><div id="strategyView"></div></section><section id="performance" class="view"><div id="performanceView"></div></section></main>
<script>
let DATA={episodes:[],calendar:[]},PLAN={days:[]},OV={episodes:{}},STRAT={},CAMPAIGN=localStorage.getItem('rls_desk_campaign')||'colossus';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function cls(s){s=String(s||'').toLowerCase();return s.includes('pass')||s.includes('ready')||s.includes('published')||s.includes('locked')?'g':s.includes('wait')||s.includes('pending')||s.includes('scheduled')||s.includes('planned')?'a':'r'}function epById(id){return(DATA.episodes||[]).find(e=>e.id===id)}function applyOverride(e){if(!e)return e;let o=OV.episodes?.[e.id];if(!o)return e;let x=JSON.parse(JSON.stringify(e));x.still=x.still||{};x.reel=x.reel||{};if(o.caption)x.still.caption=o.caption;if(o.pinned_comment)x.still.pinned_comment=o.pinned_comment;if(o.reel_status)x.reel.status=o.reel_status;if(o.reel_caption)x.reel.caption=o.reel_caption;if(o.reel_pinned_comment)x.reel.pinned_comment=o.reel_pinned_comment;if(o.reel_qa1)x.reel.qa1=o.reel_qa1;if(o.reel_qa2)x.reel.qa2=o.reel_qa2;if(o.reel_copy_qa)x.reel.copy_qa=o.reel_copy_qa;return x}function driveId(u){return(String(u||'').match(/\/d\/([^/]+)/)||[])[1]||''}function drivePreview(u){let id=driveId(u);return id?`https://drive.google.com/file/d/${id}/preview`:''}function driveDownload(u){let id=driveId(u);return id?`https://drive.google.com/uc?export=download&id=${id}`:u}function box(t,x){return `<div class="box"><div class="boxhead"><b>${t}</b><button class="copy" onclick="copyText(this)">COPY</button></div><div class="text">${esc(x||'')}</div></div>`}function media(e){let p=e.still||{},u=p.media_url||'',id=driveId(u);if(!u)return'<div class="warn">ยังไม่มี Master Image URL</div>';return `<div class="media"><iframe class="driveFrame" src="${drivePreview(u)}" loading="lazy"></iframe><div class="mediaActions"><a href="${esc(u)}" target="_blank">OPEN MASTER</a><a href="${driveDownload(u)}" target="_blank">DOWNLOAD 4K</a><button onclick="copyMaster('${id}','${esc(u)}')">COPY IMAGE</button><a href="./plan.html#publisher">USE IN PUBLISHER</a></div></div>`}function pane(e,type){let p=e[type]||{};return `<div class="pane ${type==='still'?'on':''} ${type}"><div class="meta"><div><small>STATUS</small><b class="${cls(p.status)}">${esc((p.status||'—').toUpperCase())}</b></div><div><small>QA1</small><b class="${cls(p.qa1)}">${esc(p.qa1||'—')}</b></div><div><small>QA2</small><b class="${cls(p.qa2)}">${esc(p.qa2||'—')}</b></div><div><small>COPY QA</small><b class="${cls(p.copy_qa)}">${esc(p.copy_qa||'—')}</b></div></div>${type==='still'?media(e):''}${box(type.toUpperCase()+' CAPTION',p.caption||e.still_caption)}${box('FIRST / PINNED COMMENT',p.pinned_comment||e.still_pinned)}</div>`}function renderDesk(){let q=$('q').value.toLowerCase(),a=(DATA.episodes||[]).map(applyOverride).filter(e=>JSON.stringify(e).toLowerCase().includes(q));$('list').innerHTML=a.map(e=>`<article class="card"><div class="head"><div><b>${esc(e.id)}</b><div style="color:var(--c);font-size:11px">${esc(e.title||'')}</div></div><span class="pill ${cls(e.reel?.status||e.still?.status)}">${esc((e.reel?.status||e.still?.status||'—').toUpperCase())}</span></div><div class="body"><div class="tabs"><button class="on" onclick="tab(this,'still')">STILL</button><button onclick="tab(this,'reel')">REEL</button></div>${pane(e,'still')}${pane(e,'reel')}</div></article>`).join('')}window.tab=(b,t)=>{let c=b.closest('.card');c.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');c.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));c.querySelector('.'+t).classList.add('on')};function colossusDays(){return(DATA.calendar||[]).map(c=>{let id=(c.title.match(/CS-\d{3}/)||[])[0],e=applyOverride(epById(id)||{});return{date:c.date,id,title:e.title||c.title,still:{status:e.still?.status||'ready',media_url:e.still?.media_url||'',asset_status:c.asset_status},reel:{status:e.reel?.status||'waiting'}}})}function days(){return CAMPAIGN==='colossus'?colossusDays():(PLAN.days||[])}function hasLocalThumb(id){return /^CS-(00[3-9]|01[0-3])$/.test(String(id||''))}function thumbHtml(id){if(hasLocalThumb(id))return `<div class="previewWrap"><img src="./thumbs/${id}.svg?v=2" alt="${esc(id)} master thumbnail" loading="lazy"></div>`;return `<div class="previewWrap"><div class="thumbPending">${esc(id||'')}<br>THUMBNAIL<br>COMING NEXT</div></div>`}function renderChecklist(){let a=days();$('checklistView').innerHTML=`<div class="daily">${a.map(d=>{let u=d.still?.media_url||'',open=u?`<a href="${esc(u)}" target="_blank">OPEN 4K</a>`:'';return `<div class="day"><div><b>${esc(d.date)}</b><small>${esc(d.id||'')}</small></div><div>${thumbHtml(d.id)}</div><div><b style="font-size:18px">${esc(d.title||'')}</b><div class="phase">${CAMPAIGN==='colossus'?'Reel 08:30 • Still 20:30':esc(d.phase||'')}</div><div class="quick">${open}${CAMPAIGN==='colossus'?`<a href="./plan.html#publisher">PUBLISH</a>`:''}</div></div><div class="stack"><span class="pill ${cls(d.still?.status)}">STILL ${esc((d.still?.status||'—').toUpperCase())}</span><span class="pill ${cls(d.reel?.status)}">REEL ${esc((d.reel?.status||'—').toUpperCase())}</span></div></div>`}).join('')}</div>`}function renderCalendar(){let a=days();$('calendarView').innerHTML=`<div class="calendar"><table><thead><tr><th>Date</th><th>Schedule</th><th>Story</th><th>Still</th><th>Reel</th></tr></thead><tbody>${a.map(d=>`<tr><td>${esc(d.date)}</td><td>${CAMPAIGN==='colossus'?'Reel 08:30 / Still 20:30':esc(d.format||'')}</td><td>${esc(d.title||'')}</td><td class="${cls(d.still?.status)}">${esc((d.still?.status||'—').toUpperCase())}</td><td class="${cls(d.reel?.status)}">${esc((d.reel?.status||'—').toUpperCase())}</td></tr>`).join('')}</tbody></table></div>`}function renderBatch(){let a=DATA.batch_status||[];$('batchView').innerHTML=a.map(x=>`<div class="batch"><b>${esc(x.batch)} • ${esc(x.range)}</b><div class="${cls(x.status)}">${esc(x.status)} • ${esc(x.passed)}/${esc(x.total)}</div><div style="color:var(--m);font-size:12px">${esc(x.note)}</div></div>`).join('')||'<div class="panel">ไม่มี Batch QA</div>'}function renderStrategy(){if(CAMPAIGN!=='colossus'){$('strategyView').innerHTML='<div class="panel">Strategy V1.1 แสดงเฉพาะ COLOSSUS SIGNAL</div>';return}let card=(STRAT.experiment_cards||[])[0]||{},tests=STRAT.controlled_test_batch||[],vault=STRAT.winner_vault||{},ledger=STRAT.learning_ledger||[];$('strategyView').innerHTML=`<div class="panel"><b>V1.1 GOVERNING GOAL</b><h2>${esc(STRAT.governing_goal||'')}</h2></div><div class="strategyGrid"><div class="panel"><b>${esc(card.content_id||'')} — ${esc(card.title||'')}</b><div class="kv"><b>Role</b><span>${esc(card.funnel_role)}</span></div><div class="kv"><b>Hypothesis</b><span>${esc(card.primary_hypothesis)}</span></div><div class="kv"><b>Main Variable</b><span>${esc(card.main_variable)}</span></div><div class="kv"><b>Primary KPI</b><span>${esc(card.primary_kpi)}</span></div><div class="kv"><b>Decision</b><span class="a">${esc(card.decision)}</span></div></div><div class="panel"><b>WINNER VAULT</b><p class="${cls(vault.status)}">${esc(vault.status||'')}</p><p>${esc(vault.rule||'')}</p></div></div><div class="panel"><b>CONTROLLED TEST BATCH</b>${tests.map(x=>`<div class="test"><b>${esc(x.test_id)} • ${esc(x.engine)} — ${esc(x.concept)}</b><div>${esc(x.hypothesis)}</div><small>${esc(x.production_status)}</small></div>`).join('')}</div><div class="panel"><b>LEARNING LEDGER</b>${ledger.map(x=>`<div class="test"><b>${esc(x.date)} • ${esc(x.content)}</b><div>${esc(x.hypothesis)}</div><small>Decision: ${esc(x.decision)}</small></div>`).join('')}</div>`}function perfKey(id,k){return `colossus_perf_${id}_${k}`}function renderPerformance(){if(CAMPAIGN!=='colossus'){$('performanceView').innerHTML='<div class="panel">Performance tracker แสดงเฉพาะ COLOSSUS SIGNAL</div>';return}let ids=['CS-002','CS-003','CS-004'];$('performanceView').innerHTML=`<div class="panel"><b>VIEW VELOCITY TRACKER</b><div class="phase">กรอกข้อมูลจริงเท่านั้น</div></div>${ids.map(id=>`<div class="panel"><b>${id}</b><div class="metricGrid">${['1h','6h','24h','72h','7d'].map(k=>`<div class="metric"><small>Views @ ${k}</small><input type="number" data-id="${id}" data-k="${k}" value="${localStorage.getItem(perfKey(id,k))||''}" placeholder="—"></div>`).join('')}</div></div>`).join('')}`;$('performanceView').querySelectorAll('input').forEach(i=>i.onchange=()=>localStorage.setItem(perfKey(i.dataset.id,i.dataset.k),i.value))}async function copyText(btn){let text=btn.closest('.box').querySelector('.text').innerText;try{await navigator.clipboard.writeText(text);btn.textContent='COPIED ✓';setTimeout(()=>btn.textContent='COPY',900)}catch{prompt('Copy:',text)}}async function copyMaster(id,url){try{let r=await fetch(`https://drive.google.com/uc?export=view&id=${id}`),blob=await r.blob();if(!blob.type.startsWith('image/'))throw 0;await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);alert('COPY IMAGE ✓')}catch{window.open(url,'_blank')}}async function getJSON(url,fallback){try{let r=await fetch(url+'?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch{return fallback}}async function load(){CAMPAIGN=$('campaign').value;localStorage.setItem('rls_desk_campaign',CAMPAIGN);$('publisherLink').style.display=CAMPAIGN==='colossus'?'inline-block':'none';DATA=await getJSON(CAMPAIGN==='rls'?'./rls-content.json':'./content.json',{episodes:[],calendar:[]});if(CAMPAIGN==='rls'){PLAN=await getJSON('./rls-plan.json',{days:[]});OV=await getJSON('./rls-overrides.json',{episodes:{}});STRAT={}}else{PLAN={days:[]};OV=await getJSON('./qa-overrides.json',{episodes:{}});STRAT=await getJSON('./strategy-v11.json',{})}$('brandName').textContent=CAMPAIGN==='rls'?'RLS — รอยลับพงไพร // THE HIDDEN FOREST':(DATA.brand||'COLOSSUS SIGNAL');$('modeText').textContent=CAMPAIGN==='rls'?(PLAN.mode||DATA.mode||''):(DATA.mode||'');$('dailyRule').innerHTML=CAMPAIGN==='rls'?'<b>RLS:</b> International-first production':'<b>COLOSSUS:</b> Reel 08:30 / Linked Still 20:30 • V1.1 Controlled Test';renderDesk();renderChecklist();renderCalendar();renderBatch();renderStrategy();renderPerformance()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(b.dataset.v).classList.add('on')});$('campaign').value=CAMPAIGN;$('campaign').onchange=load;$('q').oninput=renderDesk;load();
</script></body></html>
