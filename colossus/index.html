<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05090e">
<title>RLS AI Studio Content Desk</title>
<style>
:root{--b:#05090e;--p:#0a121b;--l:#173142;--c:#58d9ff;--t:#e7f9ff;--m:#7894a6;--g:#7de3a0;--a:#ffd477;--r:#ff9aa8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 0,#0d2533,#05090e 42%);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top,.wrap{max-width:1180px;margin:auto}.top{padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.controls{display:flex;gap:7px;flex-wrap:wrap}.btn,.controls select{background:#07131c;color:#dff8ff;border:1px solid #28506a;border-radius:9px;padding:8px 10px;font-weight:800;text-decoration:none}.btn.on{background:#0b3950}.wrap{padding:14px}.view{display:none}.view.on{display:block}.mode,.rule,.card,.batch{background:linear-gradient(#0a121b,#071019);border:1px solid var(--l);border-radius:14px}.mode,.rule{padding:10px 12px;margin-bottom:12px}.rule{color:#bff2ff}.search{width:100%;background:#071019;border:1px solid #203a4b;color:#fff;padding:11px;border-radius:10px;margin-bottom:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{overflow:hidden}.head{padding:12px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:10px}.body{padding:12px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:#071019;color:#9ab8c9;border:1px solid #254154;border-radius:8px;padding:8px;font-weight:800}.tabs button.on{background:#0c4057;color:#fff}.pane{display:none}.pane.on{display:block}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.meta div{background:#07131b;border:1px solid #183244;border-radius:9px;padding:8px}.meta small{display:block;color:#6e899b;font-size:8px}.media{background:#03080c;border:1px solid #1b394b;border-radius:11px;overflow:hidden;margin-bottom:10px}.media img{display:block;width:100%;max-height:560px;object-fit:contain}.mediaActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px}.mediaActions a{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:8px;text-align:center;text-decoration:none;font-size:11px;font-weight:800}.box{margin:10px 0}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.copy{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:7px;padding:6px 9px;font-weight:800}.text{white-space:pre-wrap;background:#061018;border:1px solid #1c3545;padding:10px;border-radius:9px;line-height:1.45;font-size:13px}.daily{border:1px solid var(--l);border-radius:13px;overflow:hidden}.day{display:grid;grid-template-columns:105px 90px 1fr 1fr;gap:0;border-bottom:1px solid var(--l);background:#071019}.day>div{padding:10px}.thumb{width:70px;height:94px;background:#03080c;border:1px solid #24475a;border-radius:8px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.pill{display:inline-block;border:1px solid #315167;border-radius:999px;padding:4px 7px;font-size:9px}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid var(--l);text-align:left;font-size:11px}.calendar{overflow:auto}.batch{padding:12px;margin-bottom:9px}.phase{color:var(--c);font-size:10px;margin-top:3px}@media(max-width:780px){.cards{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.day{grid-template-columns:80px 72px 1fr}.day>div:last-child{grid-column:1/4}.controls{width:100%}}
</style>
</head>
<body>
<header><div class="top"><div><b>RLS AI STUDIO CONTENT DESK</b><div style="color:var(--m);font-size:11px">COLOSSUS + RLS • one workspace</div></div><div class="controls"><select id="campaign"><option value="colossus">COLOSSUS SIGNAL</option><option value="rls">RLS — รอยลับพงไพร</option></select><button class="btn on" data-v="desk">DESK</button><button class="btn" data-v="checklist">CHECKLIST</button><button class="btn" data-v="calendar">CALENDAR</button><button class="btn" data-v="batch">BATCH QA</button><a class="btn" id="publisherLink" href="./plan.html">PUBLISHER</a></div></div></header>
<main class="wrap"><div class="mode"><b id="brandName"></b><div id="modeText" style="color:var(--a);font-size:11px"></div></div><div id="dailyRule" class="rule"></div><section id="desk" class="view on"><input id="q" class="search" placeholder="ค้นหา Episode / title / caption"><div id="list" class="cards"></div></section><section id="checklist" class="view"><div id="checklistView"></div></section><section id="calendar" class="view"><div id="calendarView"></div></section><section id="batch" class="view"><div id="batchView"></div></section></main>
<script>
let DATA={episodes:[],calendar:[]},PLAN={days:[]},OV={episodes:{}},CAMPAIGN=localStorage.getItem('rls_desk_campaign')||'rls';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cls(s){s=String(s||'').toLowerCase();return s.includes('pass')||s.includes('ready')||s.includes('published')||s.includes('locked')||s.includes('next')?'g':s.includes('wait')||s.includes('pending')||s.includes('scheduled')||s.includes('planned')||s.includes('support')?'a':'r'}
function epById(id){return DATA.episodes.find(e=>e.id===id)}
function applyOverride(e){if(!e)return e;let o=OV.episodes?.[e.id];if(!o)return e;let x=JSON.parse(JSON.stringify(e));x.still=x.still||{};x.reel=x.reel||{};if(o.caption)x.still.caption=o.caption;if(o.pinned_comment)x.still.pinned_comment=o.pinned_comment;if(o.reel_status)x.reel.status=o.reel_status;if(o.reel_caption)x.reel.caption=o.reel_caption;if(o.reel_pinned_comment)x.reel.pinned_comment=o.reel_pinned_comment;if(o.reel_qa1)x.reel.qa1=o.reel_qa1;if(o.reel_qa2)x.reel.qa2=o.reel_qa2;if(o.reel_copy_qa)x.reel.copy_qa=o.reel_copy_qa;if(o.note)x.note=o.note;return x}
function driveId(u){return(String(u||'').match(/\/d\/([^/]+)/)||[])[1]||''}function thumb(u){let id=driveId(u);return id?'https://drive.google.com/thumbnail?id='+id+'&sz=w700':''}
function box(t,x){return `<div class="box"><div class="boxhead"><b>${t}</b><button class="copy" onclick="navigator.clipboard.writeText(this.closest('.box').querySelector('.text').innerText)">COPY</button></div><div class="text">${esc(x||'')}</div></div>`}
function media(e){let p=e.still||{},u=p.media_url||'',t=thumb(u);if(!u)return'';return `<div class="media">${t?`<img src="${esc(t)}" alt="${esc(e.id)} Master">`:''}<div class="mediaActions"><a href="${esc(u)}" target="_blank">OPEN MASTER</a>${CAMPAIGN==='colossus'?'<a href="./plan.html#publisher">USE IN PUBLISHER</a>':'<a href="#calendar">VIEW IN PLAN</a>'}</div></div>`}
function pane(e,type){let p=e[type]||{};return `<div class="pane ${type==='still'?'on':''} ${type}"><div class="meta"><div><small>STATUS</small><b class="${cls(p.status)}">${esc((p.status||'—').toUpperCase())}</b></div><div><small>QA1</small><b class="${cls(p.qa1)}">${esc(p.qa1||'—')}</b></div><div><small>QA2</small><b class="${cls(p.qa2)}">${esc(p.qa2||'—')}</b></div><div><small>COPY QA</small><b class="${cls(p.copy_qa)}">${esc(p.copy_qa||'—')}</b></div></div>${type==='still'?media(e):''}${box(type.toUpperCase()+' CAPTION',p.caption||e.still_caption)}${box('FIRST / PINNED COMMENT',p.pinned_comment||e.still_pinned)}</div>`}
function renderDesk(){let q=$('q').value.toLowerCase(),a=DATA.episodes.map(applyOverride).filter(e=>JSON.stringify(e).toLowerCase().includes(q));$('list').innerHTML=a.map(e=>`<article class="card"><div class="head"><div><b>${esc(e.id)}</b><div style="color:var(--c);font-size:11px">${esc(e.title||'')}</div><div class="phase">${esc(e.note||'')}</div></div><span class="pill ${cls(e.reel?.status||e.still?.status)}">${esc((e.reel?.status||e.still?.status||'—').toUpperCase())}</span></div><div class="body"><div class="tabs"><button class="on" onclick="tab(this,'still')">STILL</button><button onclick="tab(this,'reel')">REEL</button></div>${pane(e,'still')}${pane(e,'reel')}</div></article>`).join('')}
window.tab=(b,t)=>{let c=b.closest('.card');c.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');c.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));c.querySelector('.'+t).classList.add('on')};
function colossusDays(){return(DATA.calendar||[]).map(c=>{let id=(c.title.match(/CS-\d{3}/)||[])[0],e=applyOverride(epById(id)||{}),st=e.still||{},re=e.reel||{};return{date:c.date,id,title:e.title||c.title,still:{status:st.status||'ready',asset_status:c.asset_status},reel:{status:re.status||'waiting'}}})}
function days(){return CAMPAIGN==='colossus'?colossusDays():(PLAN.days||[])}
function renderChecklist(){let a=days();$('checklistView').innerHTML=`<div class="daily">${a.map(d=>{let e=applyOverride(epById(d.id)||{}),u=e.still?.media_url||'',t=thumb(u);return `<div class="day"><div><b>${esc(d.date)}</b><div style="color:var(--m);font-size:10px">${esc(d.id||'')}</div><div class="phase">${esc(d.phase||'')}</div></div><div>${t?`<div class="thumb"><img src="${esc(t)}"></div>`:'<div class="thumb"></div>'}</div><div><b>${esc(d.title||'')}</b><div class="pill ${cls(d.still?.status)}">STILL ${esc((d.still?.status||'—').toUpperCase())}</div><div style="font-size:10px;color:var(--m)">${esc(d.still?.asset_status||'')}</div></div><div><div class="pill ${cls(d.reel?.status)}">REEL ${esc((d.reel?.status||'—').toUpperCase())}</div><div style="font-size:10px;color:var(--m);margin-top:5px">${esc(d.reel?.asset_status||'')}</div></div></div>`}).join('')}</div>`}
function renderCalendar(){let a=days();$('calendarView').innerHTML=`<div class="calendar"><table><thead><tr><th>Date</th><th>Phase</th><th>Format</th><th>Story</th><th>Still</th><th>Reel</th></tr></thead><tbody>${a.map(d=>`<tr><td>${esc(d.date)}</td><td>${esc(d.phase||'')}</td><td>${esc(d.format||'')}</td><td>${esc(d.title||'')}</td><td class="${cls(d.still?.status)}">${esc((d.still?.status||'—').toUpperCase())}</td><td class="${cls(d.reel?.status)}">${esc((d.reel?.status||'—').toUpperCase())}</td></tr>`).join('')}</tbody></table></div>`}
function renderBatch(){let a=DATA.batch_status||[];$('batchView').innerHTML=a.map(x=>`<div class="batch"><b>${esc(x.batch)} • ${esc(x.range)}</b><div class="${cls(x.status)}">${esc(x.status)} • ${esc(x.passed)}/${esc(x.total)}</div><div style="color:var(--m);font-size:12px">${esc(x.note)}</div></div>`).join('')}
async function getJSON(url,fallback){try{let r=await fetch(url+'?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch(e){return fallback}}
async function load(){CAMPAIGN=$('campaign').value;localStorage.setItem('rls_desk_campaign',CAMPAIGN);$('publisherLink').style.display=CAMPAIGN==='colossus'?'inline-block':'none';DATA=await getJSON(CAMPAIGN==='rls'?'./rls-content.json':'./content.json',{episodes:[],calendar:[]});if(CAMPAIGN==='rls'){PLAN=await getJSON('./rls-plan.json',{days:[],mode:'INTERNATIONAL-FIRST'});OV=await getJSON('./rls-overrides.json',{episodes:{}})}else{PLAN={days:[]};OV=await getJSON('./qa-overrides.json',{episodes:{}})}$('brandName').textContent=CAMPAIGN==='rls'?'RLS — รอยลับพงไพร // THE HIDDEN FOREST':(DATA.brand||'COLOSSUS SIGNAL');$('modeText').textContent=CAMPAIGN==='rls'?(PLAN.mode||DATA.mode||''):(DATA.mode||'');$('dailyRule').innerHTML=CAMPAIGN==='rls'?'<b>RLS NORMAL PLAN:</b> International-first • 1 mainline minimum/day • up to 4 support drops when useful • Sep 06 Reel 001 exception complete • NEXT: RLS-002 CAMERA 07':'<b>COLOSSUS:</b> Reel 08:30 / Linked Still 20:30 • Master Still + Copy Pack locked';renderDesk();renderChecklist();renderCalendar();renderBatch()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(b.dataset.v).classList.add('on')});$('campaign').value=CAMPAIGN;$('campaign').onchange=load;$('q').oninput=renderDesk;load();
</script>
</body></html>
