<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090e">
<title>Colossus Content Desk</title>
<style>
:root{--bg:#05090e;--panel:#0a1119;--line:#173142;--cyan:#58d9ff;--text:#e5f9ff;--muted:#7894a6;--green:#7de3a0;--amber:#ffd477}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#0b1e2b,#05090e 38%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:9;padding:16px;background:#05090eee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}header b{letter-spacing:1.8px}header small{display:block;color:var(--muted);margin-top:4px}.wrap{max-width:960px;margin:auto;padding:14px}.search{width:100%;background:#071019;border:1px solid #203a4b;color:var(--text);padding:13px;border-radius:11px;margin-bottom:14px;font-size:16px}.card{background:linear-gradient(180deg,#0a121b,#071019);border:1px solid var(--line);border-radius:16px;margin-bottom:15px;overflow:hidden}.head{padding:15px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.title b{font-size:20px}.title span{display:block;color:#79d8f4;font-size:12px;margin-top:3px}.ai{font-size:10px;color:#ffd98a;border:1px solid #6e5726;background:#251c09;padding:6px 8px;border-radius:999px;white-space:nowrap}.tabs{display:flex;gap:8px;padding:12px 12px 0}.tabs button{flex:1;background:#08111a;border:1px solid #254154;color:#9ab8c9;padding:10px;border-radius:9px;font-weight:800}.tabs button.on{background:#0c4057;color:#e6fbff;border-color:#3ba9d0}.pane{display:none;padding:13px}.pane.on{display:block}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.meta div{background:#07121a;border:1px solid #172e3d;border-radius:10px;padding:9px}.meta small{display:block;color:#68869a;font-size:9px;letter-spacing:1px}.meta strong{font-size:12px}.status-published{color:var(--green)}.status-scheduled{color:var(--amber)}.box{margin:12px 0}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.boxhead b{font-size:11px;letter-spacing:1px}.copy{border:1px solid #2d7593;background:#0a3041;color:#dbf8ff;border-radius:8px;padding:7px 10px;font-weight:800}.text{white-space:pre-wrap;background:#061018;border:1px solid #1c3545;padding:12px;border-radius:10px;line-height:1.5;font-size:14px;user-select:text}.note{margin:0 13px 13px;padding:10px;border-left:2px solid #3296ba;background:#07151e;color:#7895a8;font-size:11px;line-height:1.5}.empty{text-align:center;color:var(--muted);padding:40px}.foot{text-align:center;color:#607c8f;font-size:10px;padding:20px}.reload{float:right;background:none;border:1px solid #264554;color:#8fb1c3;border-radius:8px;padding:6px 9px}
</style>
</head>
<body>
<header><button class="reload" onclick="load()">↻ Refresh</button><b>COLOSSUS CONTENT DESK</b><small>Mobile Web • Reel + Still copy pack</small></header>
<main class="wrap"><input id="q" class="search" placeholder="ค้นหา CS-002, Moon, caption..." oninput="render()"><div id="list"></div><div class="foot">เปิดจากมือถือได้ทันที • ไม่ต้องโหลดแอป • ข้อมูลอัปเดตจาก Content Desk กลาง</div></main>
<script>
let DATA={episodes:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{const r=await fetch('./content.json?ts='+Date.now(),{cache:'no-store'});DATA=await r.json();render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">โหลดข้อมูลไม่สำเร็จ ลองกด Refresh</div>'}}
function pane(ep,type){const p=ep[type], status=p.status||'ready';return `<div class="pane ${type==='reel'?'on':''} ${type}"><div class="meta"><div><small>POST TIME • THAILAND</small><strong>${esc(p.post_time||'—')}</strong></div><div><small>STATUS</small><strong class="status-${esc(status)}">${esc(status.toUpperCase())}</strong></div></div><div class="box"><div class="boxhead"><b>${type==='reel'?'FACEBOOK REEL':'STILL IMAGE'} CAPTION</b><button class="copy" onclick="copyText(this)">COPY</button></div><div class="text">${esc(p.caption)}</div></div><div class="box"><div class="boxhead"><b>PINNED COMMENT</b><button class="copy" onclick="copyText(this)">COPY</button></div><div class="text">${esc(p.pinned_comment)}</div></div></div>`}
function render(){const q=document.getElementById('q').value.toLowerCase();const eps=(DATA.episodes||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('list').innerHTML=eps.length?eps.map((e,i)=>`<article class="card"><div class="head"><div class="title"><b>${esc(e.id)}</b><span>${esc(e.title)}</span></div><div class="ai">⚠ AI INFO</div></div><div class="tabs"><button class="on" onclick="tab(this,'reel')">REEL</button><button onclick="tab(this,'still')">STILL</button></div>${pane(e,'reel')}${pane(e,'still')}<div class="note">${esc(e.note||'')}<br>REMINDER: เปิด AI info / Made with AI ตอนโพสต์ หาก Facebook แสดงตัวเลือกนี้</div></article>`).join(''):'<div class="empty">ไม่พบ Episode</div>'}
function tab(btn,type){const c=btn.closest('.card');c.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');c.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));c.querySelector('.'+type).classList.add('on')}
async function copyText(btn){const text=btn.closest('.box').querySelector('.text').innerText;try{await navigator.clipboard.writeText(text);const old=btn.textContent;btn.textContent='COPIED ✓';setTimeout(()=>btn.textContent=old,900)}catch(e){prompt('Copy:',text)}}
load();
</script>
</body>
</html>
