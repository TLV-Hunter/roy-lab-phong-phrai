<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090e">
<title>Colossus Content Desk</title>
<style>
:root{--bg:#05090e;--panel:#0a1119;--line:#173142;--cyan:#58d9ff;--text:#e5f9ff;--muted:#7894a6;--green:#7de3a0;--amber:#ffd477}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#0b1e2b,#05090e 38%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:9;padding:16px;background:#05090eee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}header b{letter-spacing:1.8px}header small{display:block;color:var(--muted);margin-top:4px}.wrap{max-width:960px;margin:auto;padding:14px}.search{width:100%;background:#071019;border:1px solid #203a4b;color:var(--text);padding:13px;border-radius:11px;margin-bottom:14px;font-size:16px}.card{background:linear-gradient(180deg,#0a121b,#071019);border:1px solid var(--line);border-radius:16px;margin-bottom:15px;overflow:hidden}.head{padding:15px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.title b{font-size:20px}.title span{display:block;color:#79d8f4;font-size:12px;margin-top:3px}.ai{font-size:10px;color:#ffd98a;border:1px solid #6e5726;background:#251c09;padding:6px 8px;border-radius:999px;white-space:nowrap}.tabs{display:flex;gap:8px;padding:12px 12px 0}.tabs button{flex:1;background:#08111a;border:1px solid #254154;color:#9ab8c9;padding:10px;border-radius:9px;font-weight:800}.tabs button.on{background:#0c4057;color:#e6fbff;border-color:#3ba9d0}.pane{display:none;padding:13px}.pane.on{display:block}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.meta div{background:#07121a;border:1px solid #172e3d;border-radius:10px;padding:9px}.meta small{display:block;color:#68869a;font-size:9px;letter-spacing:1px}.meta strong{font-size:12px}.status-published{color:var(--green)}.status-scheduled{color:var(--amber)}.box{margin:12px 0}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}.boxhead b{font-size:11px;letter-spacing:1px}.copy,.imgbtn{border:1px solid #2d7593;background:#0a3041;color:#dbf8ff;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer}.text{white-space:pre-wrap;background:#061018;border:1px solid #1c3545;padding:12px;border-radius:10px;line-height:1.5;font-size:14px;user-select:text}.note{margin:0 13px 13px;padding:10px;border-left:2px solid #3296ba;background:#07151e;color:#7895a8;font-size:11px;line-height:1.5}.empty{text-align:center;color:var(--muted);padding:40px}.foot{text-align:center;color:#607c8f;font-size:10px;padding:20px}.reload{float:right;background:none;border:1px solid #264554;color:#8fb1c3;border-radius:8px;padding:6px 9px}.media{margin:2px 0 14px;background:#050b10;border:1px solid #1c3545;border-radius:13px;overflow:hidden}.mediaTop{padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #173142}.mediaTop b{font-size:11px;letter-spacing:1px}.mediaTop small{color:#7de3a0;font-size:10px}.mediaStage{min-height:320px;display:flex;align-items:center;justify-content:center;background:#020609;position:relative}.mediaStage img{display:block;width:100%;max-height:720px;object-fit:contain}.mediaLoading{color:#7792a2;font-size:12px;padding:36px;text-align:center}.mediaActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.imgbtn{width:100%;font-size:12px}.imgbtn.download{border-color:#446a45;background:#12311f;color:#bdf2c9}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0a3041;border:1px solid #2d7593;color:#e5f9ff;padding:10px 14px;border-radius:10px;font-size:12px;z-index:99;display:none;box-shadow:0 8px 30px #0008}
@media(max-width:600px){.wrap{padding:10px}.mediaStage{min-height:260px}.mediaActions{grid-template-columns:1fr 1fr}.imgbtn{padding:10px 7px}.meta{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><button class="reload" onclick="load()">↻ Refresh</button><b>COLOSSUS CONTENT DESK</b><small>Mobile Web • Reel + Still + Master Image archive</small></header>
<main class="wrap"><input id="q" class="search" placeholder="ค้นหา CS-003, Moon, caption..." oninput="render()"><div id="list"></div><div class="foot">Master Image + Caption + Pinned Comment เก็บคู่กัน • Copy / Download ได้จากหน้าเดียว</div></main><div id="toast" class="toast"></div>
<script>
let DATA={episodes:[]};const MEDIA=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.style.display='none',1500)}
async function load(){try{const r=await fetch('./content.json?ts='+Date.now(),{cache:'no-store'});DATA=await r.json();render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">โหลดข้อมูลไม่สำเร็จ ลองกด Refresh</div>'}}
function mediaBox(ep){const a=ep.still&&ep.still.image_asset;if(!a)return'';return `<div class="media"><div class="mediaTop"><b>MASTER IMAGE • ORIGINAL ARCHIVE</b><small>${esc(a.width)}×${esc(a.height)} • 4K</small></div><div class="mediaStage"><div id="loading-${esc(ep.id)}" class="mediaLoading">กำลังโหลด Master Image...</div><img id="img-${esc(ep.id)}" alt="${esc(ep.id)} Master Image" hidden></div><div class="mediaActions"><button class="imgbtn" onclick="copyImage('${esc(ep.id)}')">COPY IMAGE</button><button class="imgbtn download" onclick="downloadImage('${esc(ep.id)}')">DOWNLOAD JPG</button></div></div>`}
function pane(ep,type){const p=ep[type],status=p.status||'ready';return `<div class="pane ${type==='reel'?'on':''} ${type}"><div class="meta"><div><small>POST TIME • THAILAND</small><strong>${esc(p.post_time||'—')}</strong></div><div><small>STATUS</small><strong class="status-${esc(status)}">${esc(status.toUpperCase())}</strong></div></div>${type==='still'?mediaBox(ep):''}<div class="box"><div class="boxhead"><b>${type==='reel'?'FACEBOOK REEL':'STILL IMAGE'} CAPTION</b><button class="copy" onclick="copyText(this)">COPY</button></div><div class="text">${esc(p.caption)}</div></div><div class="box"><div class="boxhead"><b>PINNED COMMENT</b><button class="copy" onclick="copyText(this)">COPY</button></div><div class="text">${esc(p.pinned_comment)}</div></div></div>`}
function render(){const q=document.getElementById('q').value.toLowerCase();const eps=(DATA.episodes||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('list').innerHTML=eps.length?eps.map(e=>`<article class="card"><div class="head"><div class="title"><b>${esc(e.id)}</b><span>${esc(e.title)}</span></div><div class="ai">⚠ AI INFO</div></div><div class="tabs"><button class="on" onclick="tab(this,'reel')">REEL</button><button onclick="tab(this,'still')">STILL</button></div>${pane(e,'reel')}${pane(e,'still')}<div class="note">${esc(e.note||'')}<br>REMINDER: เปิด AI info / Made with AI ตอนโพสต์ หาก Facebook แสดงตัวเลือกนี้</div></article>`).join(''):'<div class="empty">ไม่พบ Episode</div>';eps.filter(e=>e.still&&e.still.image_asset).forEach(e=>loadMaster(e.id).catch(err=>{const x=document.getElementById('loading-'+e.id);if(x)x.textContent='โหลดภาพไม่สำเร็จ • '+err.message}))}
function tab(btn,type){const c=btn.closest('.card');c.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');c.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));c.querySelector('.'+type).classList.add('on')}
async function copyText(btn){const text=btn.closest('.box').querySelector('.text').innerText;try{await navigator.clipboard.writeText(text);const old=btn.textContent;btn.textContent='COPIED ✓';setTimeout(()=>btn.textContent=old,900)}catch(e){prompt('Copy:',text)}}
function epById(id){return (DATA.episodes||[]).find(e=>e.id===id)}
async function getMedia(id){if(MEDIA.has(id))return MEDIA.get(id);const ep=epById(id),a=ep&&ep.still&&ep.still.image_asset;if(!a)throw Error('ไม่มี Master Image');let chunks=[];for(let i=1;i<=a.parts;i++){const n=String(i).padStart(2,'0');const r=await fetch(`${a.base_path}part${n}.txt?ts=${DATA.updated_at||''}`,{cache:'force-cache'});if(!r.ok)throw Error('asset part '+n);chunks.push((await r.text()).trim())}const bin=atob(chunks.join(''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const blob=new Blob([bytes],{type:a.mime||'image/avif'}),url=URL.createObjectURL(blob),m={blob,url,asset:a};MEDIA.set(id,m);return m}
async function loadMaster(id){const m=await getMedia(id),img=document.getElementById('img-'+id),loading=document.getElementById('loading-'+id);if(img){img.src=m.url;img.onload=()=>{img.hidden=false;if(loading)loading.style.display='none'}}}
async function imageCanvas(id){const m=await getMedia(id);let img=document.getElementById('img-'+id);if(!img||!img.complete||!img.naturalWidth){await new Promise((res,rej)=>{const x=new Image();x.onload=()=>{img=x;res()};x.onerror=rej;x.src=m.url})}const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);return c}
async function copyImage(id){try{const c=await imageCanvas(id),png=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('PNG encode failed')),'image/png'));if(!navigator.clipboard||!window.ClipboardItem)throw Error('เบราว์เซอร์ไม่รองรับ Copy Image');await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);notify('COPY IMAGE ✓ '+id)}catch(e){notify('Copy ไม่สำเร็จ • ใช้ Download JPG แทน')}}
async function downloadImage(id){try{const ep=epById(id),c=await imageCanvas(id),jpg=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('JPG encode failed')),'image/jpeg',0.96)),u=URL.createObjectURL(jpg),a=document.createElement('a');a.href=u;a.download=(ep.still.image_asset.filename||id+'_MASTER_4K.jpg');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);notify('DOWNLOAD JPG ✓ '+id)}catch(e){notify('Download ไม่สำเร็จ • '+e.message)}}
load();
</script>
</body>
</html>
