<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let C={},R={},Z={episodes:[],brand:"RLS — THE HIDDEN FOREST / THE FOREST UNLEASHED"},B={},A={},S={entries:[]},Q={entries:[]},CS={entries:[]},CR={entries:[]},URLCAM=new URLSearchParams(location.search).get('campaign'),CAM=['colossus','rls','rls-ss3','bruno'].includes(URLCAM)?URLCAM:(localStorage.getItem('rls_desk_campaign')||'rls'),MODE='single';
function pass(v){return /pass|locked|published|scheduled/i.test(String(v||''))}
function cls(v){v=String(v||'').toLowerCase();return /pass|ready|locked|published/.test(v)?'g':/pending|planned|waiting|scheduled|next/.test(v)?'a':'r'}
function driveId(u){return(String(u||'').match(/\/d\/([^/]+)/)||[])[1]||''}
function driveView(u){let id=driveId(u);return id?`https://drive.google.com/file/d/${id}/preview`:u||''}
function driveDl(u){let id=driveId(u);return id?`https://drive.google.com/uc?export=download&id=${id}`:u||''}
function driveImg(u){let id=driveId(u);return id?`https://lh3.googleusercontent.com/d/${id}=w4096`:u||''}
function driveImgAlt(u){let id=driveId(u);return id?`https://drive.google.com/thumbnail?id=${id}&sz=w4096`:u||''}
function copyEntry(id){return(Q.entries||[]).find(x=>x.id===id)||{}}
function starterEntry(id){return(S.entries||[]).find(x=>x.id===id)||{}}
function colStarterEntry(id){return(CS.entries||[]).find(x=>x.id===id)||{}}
function colReelEntry(id){return(CR.entries||[]).find(x=>x.id===id)||{}}
function colossusMonthSummary(){
  const em=Object.fromEntries((C.episodes||[]).map(e=>[e.id,e]));
  const ids=(C.calendar||[]).filter(x=>String(x.date||'')>='2026-09-01'&&String(x.date||'')<='2026-09-30').map(x=>(String(x.title||'').match(/CS-\d{3}/)||[])[0]).filter(Boolean);
  const isPub=v=>String(v||'').toLowerCase()==='published';
  const isSkip=v=>String(v||'').toLowerCase()==='skipped';
  const isClosed=v=>isPub(v)||isSkip(v);
  const num=id=>Number(String(id||'').replace('CS-',''))||0;
  const maxId=a=>a.length?'CS-'+String(Math.max(...a.map(num))).padStart(3,'0'):'—';
  const rp=ids.filter(id=>isPub(em[id]?.reel?.status)),sp=ids.filter(id=>isPub(em[id]?.still?.status));
  const finalMissing=[],linkMissing=[];
  ids.filter(id=>num(id)>=19).forEach(id=>{
    let e=em[id]||{},r=colReelEntry(id);if(isSkip(e.reel?.status))return;let exists=e.reel?.final_exists===true||!!r.media_url||/^published$/i.test(String(r.status||''))||/final exists|v3 final|final generated/i.test(String(r.qa||'')+' '+String(r.media_link_status||'')+' '+String(r.local_file||'')),url=e.reel?.final_media_url||r.media_url||'';
    if(!exists)finalMissing.push(id);else if(!url)linkMissing.push(id)
  });
  const next=ids.find(id=>!isClosed(em[id]?.reel?.status))||'—';
  return{reelThrough:maxId(rp),stillThrough:maxId(sp),next,finalMissing,linkMissing,pendingReels:ids.filter(id=>!isClosed(em[id]?.reel?.status)),pendingStills:ids.filter(id=>!isClosed(em[id]?.still?.status))}
}
function source(){return CAM==='rls'?R:CAM==='rls-ss3'?Z:CAM==='bruno'?B:C}
function eps(){let a=(source().episodes||[]).slice();if(CAM==='bruno'){return a.sort((x,y)=>{let nx=parseInt(String(x.id||'').replace(/\D/g,''))||9999,ny=parseInt(String(y.id||'').replace(/\D/g,''))||9999;return nx-ny})}return a.sort((x,y)=>String(x.date||'').localeCompare(String(y.date||'')))}
function syncPublisher(){let a=$('publisherLink');if(!a)return;a.href=CAM==='rls'?'./rls-daily-queue.html':CAM==='rls-ss3'?'./rls-ss3.html':CAM==='bruno'?'../publisher.html?brand=bruno':'./plan.html';a.textContent=CAM==='rls-ss3'?'SS3 SOURCE':'PUBLISHER'}
function brunoImported(id){return(B.imported_clips||[]).find(x=>x.id===id)||{}}
function copyBlock(title,text,qa,key){if(!pass(qa))return `<div class="copybox"><div class="copyhead"><b>${title}</b><span class="pill a">COPY QA PENDING</span></div><div class="pending">ซ่อนข้อความไว้จนกว่า COPY QA จะ PASS</div></div>`;return `<div class="copybox"><div class="copyhead"><b>${title}</b><button onclick="copyText('${key}')">COPY</button></div><div class="text" id="${key}">${esc(text||'')}</div></div>`}
window.copyText=async id=>{let t=$(id)?.innerText||'';try{await navigator.clipboard.writeText(t)}catch{prompt('Copy:',t)}};
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-copy-id]');if(b){copyText(b.dataset.copyId);b.textContent='COPIED ✓';setTimeout(()=>{b.textContent='COPY'},1200)}});
window.imageFallback=img=>{let alt=img.dataset.alt||'';if(img.dataset.tried!=='1'&&alt){img.dataset.tried='1';img.src=alt;return}img.style.display='none';let f=img.nextElementSibling;if(f)f.style.display='block'};
window.copyImage4K=async(u,btn)=>{let src=driveImg(u),old=btn.textContent;try{let res=await fetch(src,{mode:'cors',cache:'no-store'});if(!res.ok)throw new Error('fetch');let blob=await res.blob();let bmp=await createImageBitmap(blob),c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;c.getContext('2d').drawImage(bmp,0,0);let png=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('png')),'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);btn.textContent='COPIED IMAGE ✓';setTimeout(()=>btn.textContent=old,1200)}catch(e){let w=window.open(src,'_blank');btn.textContent='OPENED FOR COPY';setTimeout(()=>btn.textContent=old,1400);if(!w)alert('เบราว์เซอร์บล็อกการ Copy image อัตโนมัติ — กด OPEN 4K ORIGINAL หรือ DOWNLOAD 4K ได้ตามเดิม')}};
function imageSlot(title,u,qa,id,kind,copyHtml){let has=!!u,img=driveImg(u),alt=driveImgAlt(u),view=driveView(u);return `<div class="slot"><div class="slothead"><b>${title}</b><span class="pill ${cls(qa)}">${esc(qa||'—')}</span></div><div class="viewer">${has?`<img class="assetimg" src="${esc(img)}" data-alt="${esc(alt)}" data-tried="0" alt="${esc(id+' '+kind)}" loading="${MODE==='single'?'eager':'lazy'}" onerror="imageFallback(this)"><iframe src="${esc(view)}" allow="autoplay" style="display:none"></iframe>`:`<div class="waiting"><b>4K ASSET NOT READY</b>ยังไม่มีไฟล์ Final สำหรับช่องนี้</div>`}</div><div class="actions imageactions">${has?`<a href="${esc(u)}" target="_blank">OPEN 4K ORIGINAL</a><a href="${esc(driveDl(u))}" target="_blank">DOWNLOAD 4K</a><button onclick="copyImage4K('${esc(u)}',this)">COPY IMAGE</button>`:`<span></span><span></span><span></span>`}</div>${copyHtml||''}</div>`}
function reelSlot(e,cp){let r=e.reel||{},u=r.media_url||r.final_media_url||'',q=cp.reel?.copy_qa||r.copy_qa||'',label=r.resolution?`REEL • FINAL ${r.resolution}`:'REEL • FINAL';let media=reelVideoView(u,"Final Reel not hosted. Select local MP4 for preview.");return `<div class="slot reelslot"><div class="slothead"><b>${esc(label)}</b><span class="pill ${cls(r.status||'waiting')}">${esc((r.status||'WAITING').toUpperCase())}</span></div><div class="viewer">${media}</div>${videoPreviewControl()}<div class="actions">${u?`<a href="${esc(u)}" target="_blank">OPEN FINAL REEL</a><a href="${esc(driveDl(u))}" target="_blank">DOWNLOAD FINAL</a>`:`<span></span><span></span>`}</div>${copyBlock('REEL CAPTION',cp.reel?.caption||r.caption,q,'rcap-'+e.id)}${copyBlock('REEL PINNED COMMENT',cp.reel?.comment||r.pinned_comment,q,'rpin-'+e.id)}</div>`}
function colReelSlot(e){let r=colReelEntry(e.id),u=r.media_url||'',q=r.copy_qa||'',exists=!!u||/ready|published/i.test(String(r.status||'')),media=u?reelVideoView(u):exists?`<div class="waiting"><b>FINAL EXISTS • MEDIA LINK PENDING</b>Final Reel ของตอนนี้มีแล้ว แต่ยังไม่ได้ผูกลิงก์ไฟล์ที่ตรวจสอบถูกต้องเข้ากับเว็บ</div>`:`<div class="waiting"><b>FINAL REEL NOT YET UPLOADED</b>เมื่อ Final Reel ผ่าน QA และอัปโหลดแล้ว ระบบจะแสดงในช่องนี้</div>`;return `<div class="slot reelslot"><div class="slothead"><b>REEL • FINAL</b><span class="pill ${cls(r.status||'waiting')}">${esc((r.status||'WAITING').toUpperCase())}${r.qa?' • '+esc(r.qa):''}</span></div><div class="viewer">${media}</div>${videoPreviewControl()}<div class="actions">${u?`<a href="${esc(u)}" target="_blank">OPEN FINAL REEL</a><a href="${esc(driveDl(u))}" target="_blank">DOWNLOAD FINAL</a>`:exists?`<span class="pill a">MEDIA LINK PENDING</span><span></span>`:`<span></span><span></span>`}</div>${copyBlock('REEL CAPTION',r.caption,q,'crcap-'+e.id)}${copyBlock('REEL FIRST COMMENT',r.pinned_comment,q,'crpin-'+e.id)}</div>`}

function ss3CopyBox(title,body,key){
 return '<div class="copybox"><div class="copyhead"><b>'+esc(title)+'</b><button type="button" data-copy-id="'+esc(key)+'">COPY</button></div><div class="pill a" style="margin:6px 9px">PREPARED DRAFT · NOT POSTED</div><div class="text" id="'+esc(key)+'">'+esc(body||'Content pending')+'</div></div>'
}
function localVideoLoad(input){
 const file=input.files&&input.files[0];if(!file)return;
 if(file.type!=='video/mp4'&&!/\.mp4$/i.test(file.name)){alert('Select an MP4 file.');return}
 const view=input.closest('.slot')?.querySelector('.viewer');if(!view)return;
 if(view.dataset.localBlob){URL.revokeObjectURL(view.dataset.localBlob)}
 const link=URL.createObjectURL(file);
 view.dataset.localBlob=link;
 view.innerHTML='<video controls playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain" src="'+esc(link)+'"></video>';
 const note=input.closest('.slot')?.querySelector('[data-local-note]');if(note)note.textContent='LOCAL PREVIEW ONLY · '+file.name+' · Not uploaded to GitHub or published';
 const vid=view.querySelector('video');if(vid)vid.play().catch(()=>{});
}
window.localVideoLoad=localVideoLoad;
function videoPreviewControl(){
 return '<div class="actions" style="align-items:center"><label class="btn" style="cursor:pointer;text-align:center">OPEN MP4 ON THIS DEVICE<input type="file" accept=".mp4,video/mp4" onchange="localVideoLoad(this)" style="display:none"></label><small style="color:var(--m)" data-local-note>Preview only · no upload</small></div>';
}
function reelVideoView(url,missingMessage){
 const u=String(url||'');
 if(!u)return '<div class="waiting"><b>FINAL VIDEO NOT HOSTED HERE</b>'+esc(missingMessage||'No verified MP4 web link. Choose a local MP4 below for a temporary preview.')+'</div>';
 if(/\.(mp4|m4v|webm)(\?|#|$)/i.test(u))
   return '<video controls playsinline preload="metadata" src="'+esc(u)+'"></video>';
 return '<iframe src="'+esc(driveView(u))+'" loading="lazy" allow="autoplay; fullscreen; encrypted-media" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>';
}
function ss3Asset(e,which){
 const record=which==='master'?(e.master_still||{}):(e.starter_frame||{}),u=record.image_url||'';
 const msg=which==='master'?'NEW MASTER SOURCE NOT HOSTED':'STARTER FRAME SOURCE NOT HOSTED';
 const media=u?'<img class="assetimg" src="'+esc(u)+'" alt="'+esc(e.id+' '+which+' old preview')+'" loading="lazy" onerror="imageFallback(this)"><div class="waiting" style="display:none"><b>IMAGE NOT AVAILABLE</b>Check preview path</div>':
   '<div class="waiting"><b>'+msg+'</b>Independent source image was created in chat but is not yet on GitHub Pages. Do not substitute an older rejected still.</div>';
 const nav=u?'<div class="actions"><a href="'+esc(u)+'" target="_blank" rel="noopener">'+(which==='master'?'OPEN ARCHIVED PREVIEW':'OPEN HISTORICAL STARTER')+'</a><a href="'+esc(u)+'" download>DOWNLOAD PREVIEW</a></div>':'';
 return {media,nav,status:record.status||'NOT VERIFIED'}
}
function ss3Card(e){
 const master=ss3Asset(e,'master'),starter=ss3Asset(e,'starter'),story=e.storyboard||{},r=e.final_reel||{};
 const qa=e.creative_qa_status||'NOT VERIFIED',boards=(story.beats||[]).map((b,i)=>'<li><b>'+esc(i+1)+' · '+esc(b.from)+'–'+esc(b.to)+'s</b> '+esc(b.action)+'</li>').join('');
 const sb=story.image_url?'<a href="'+esc(story.image_url)+'" target="_blank" rel="noopener">VIEW STORYBOARD</a>':'<span class="pill a">STORYBOARD IMAGE NOT HOSTED</span>';
 const box1='<div class="slot"><div class="slothead"><b>01 / MASTER STILL · '+(master.status.includes('HISTORICAL')?'ARCHIVE PREVIEW':'LATEST SOURCE')+'</b><span class="pill '+cls(qa)+'">'+esc(qa)+'</span></div><div class="viewer">'+master.media+'</div>'+master.nav+
  '<div style="padding:10px;color:var(--m);font-size:12px">Status: '+esc(master.status)+' · New source PNG is not certified native 4K.</div>'+
  ss3CopyBox('STILL CAPTION + HASHTAGS',e.still_caption,'ss3-mcap-'+e.id)+ss3CopyBox('STILL FIRST COMMENT',e.first_comment,'ss3-mpin-'+e.id)+'</div>';
 const box2='<div class="slot"><div class="slothead"><b>02 / STARTER + STORYBOARD + PROMPT</b><span class="pill a">WEB IMAGE PENDING</span></div><div class="viewer">'+starter.media+'</div>'+starter.nav+
   '<div style="padding:10px;color:var(--m);font-size:12px">STARTER: '+esc(starter.status)+'<br>STORYBOARD: '+esc(story.status||'NOT VERIFIED')+'</div>'+
   '<div class="copybox"><div class="copyhead"><b>6 BEATS · 10 SECONDS</b>'+sb+'</div><ol style="padding:8px 16px 8px 32px;margin:0;line-height:1.65">'+boards+'</ol></div>'+
   ss3CopyBox('DOLA · 3-REFERENCE VIDEO PROMPT',e.video_prompt,'ss3-prompt-'+e.id)+'</div>';
