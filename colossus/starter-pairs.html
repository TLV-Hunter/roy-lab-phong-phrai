<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05090e"><title>RLS — Master ↔ Starter</title>
<style>
:root{--b:#05090e;--p:#0a121b;--l:#173142;--c:#58d9ff;--t:#e7f9ff;--m:#7894a6;--g:#7de3a0;--a:#ffd477;--r:#ff9aa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 0,#0d2533,#05090e 42%);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,a{font:inherit}.top,.wrap{max-width:1420px;margin:auto}.top{padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand b{font-size:20px}.brand small{display:block;color:var(--m);font-size:11px;margin-top:3px}.nav,.toolbar{display:flex;gap:7px;flex-wrap:wrap}.btn,button,select{border:1px solid #2e708e;background:#0a3041;color:#dff8ff;border-radius:9px;padding:8px 11px;text-decoration:none;font-weight:800}.btn.on,button.on{background:#0c4057}.wrap{padding:14px}.panel,.card{background:linear-gradient(#0a121b,#071019);border:1px solid var(--l);border-radius:14px}.panel{padding:12px 14px;margin-bottom:12px}.toolbar{align-items:center}.toolbar select{min-width:320px;max-width:100%;background:#07131c}.status{color:#bff2ff;font-size:11px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr;gap:14px}.all.grid{grid-template-columns:1fr 1fr}.card{overflow:hidden}.head{padding:12px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head h2{margin:0;font-size:18px}.date{color:var(--c);font-size:11px;margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid #315167;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;white-space:nowrap}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}.body{padding:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.asset{background:#03080c;border:1px solid #1b394b;border-radius:11px;overflow:hidden}.assetHead{padding:8px 9px;background:#07131b;border-bottom:1px solid #173142;display:flex;justify-content:space-between;align-items:center}.assetHead b{font-size:12px}.imgbox{height:min(62vh,720px);min-height:420px;display:flex;align-items:center;justify-content:center;background:#020609}.imgbox img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:auto;-webkit-user-drag:auto}.missing{padding:24px;text-align:center;color:#7c98aa}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px}.actions a,.actions button{font-size:10px;text-align:center;padding:7px 8px}.section{margin-top:11px}.sectionHead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.text{white-space:pre-wrap;background:#061018;border:1px solid #1c3545;padding:10px;border-radius:9px;line-height:1.48;font-size:12px;max-height:220px;overflow:auto}.hint{font-size:11px;color:#ffd477;margin-top:8px}.empty{padding:28px;text-align:center;color:var(--m)}@media(max-width:1050px){.all.grid{grid-template-columns:1fr}.imgbox{height:520px}}@media(max-width:720px){.pair{grid-template-columns:1fr}.imgbox{height:520px}.toolbar select{min-width:0;width:100%}.toolbar button{flex:1}.nav{width:100%}.nav .btn{flex:1;text-align:center}.head{flex-direction:column}.badges{justify-content:flex-start}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><b>RLS — MASTER ↔ STARTER</b><small>เลือกดูทีละวัน หรือเปิดทั้งหมด • เฉพาะ QA PASS</small></div><div class="nav"><a class="btn" href="./">← CONTENT DESK</a><a class="btn on" href="./starter-pairs.html">MASTER ↔ STARTER</a><a class="btn" href="./plan.html">PUBLISHER</a></div></div></header>
<main class="wrap">
<div class="panel"><div class="toolbar"><select id="episode"></select><button id="singleBtn" class="on">ดูวันที่เลือก</button><button id="allBtn">ดูทั้งหมด</button></div><div id="status" class="status">กำลังโหลด...</div><div class="hint">รูปบนหน้านี้เป็น &lt;img&gt; ปกติ: คลิกขวาที่รูป → Copy image ได้เลย • ถ้าต้องการไฟล์เต็มให้กด DOWNLOAD ORIGINAL</div></div>
<div id="list" class="grid"></div>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let CONTENT={episodes:[]},STARTERS={entries:[]},MODE='single';
function driveId(u){return(String(u||'').match(/\/d\/([^/]+)/)||[])[1]||''}
function preview(u){let id=driveId(u);return id?`https://drive.google.com/thumbnail?sz=w1600&id=${id}`:u||''}
function download(u){let id=driveId(u);return id?`https://drive.google.com/uc?export=download&id=${id}`:u||''}
function isPass(v){return /pass|locked|published|scheduled/i.test(String(v||''))}
function masterOf(id){return(CONTENT.episodes||[]).find(e=>e.id===id)||{}}
function masterPass(e){let s=e.still||{};return !!s.media_url&&(isPass(s.qa1)||isPass(s.qa2)||isPass(s.status))}
function qaPairs(){return(STARTERS.entries||[]).filter(s=>isPass(s.starter_qa)&&isPass(s.prompt_qa)&&masterPass(masterOf(s.id))).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function asset(label,u,kind,qa,id){let p=preview(u);return `<div class="asset"><div class="assetHead"><b>${label}</b><span class="pill g">${esc(qa||'QA PASS')}</span></div><div class="imgbox" id="box-${id}-${kind}"><img src="${esc(p)}" alt="${esc(id+' '+kind)}" loading="${MODE==='single'?'eager':'lazy'}" referrerpolicy="no-referrer" onerror="fallback(this,'${esc(u)}','${id}','${kind}')"></div><div class="actions"><a class="btn" href="${esc(u)}" target="_blank">OPEN ORIGINAL</a><a class="btn" href="${esc(download(u))}" target="_blank">DOWNLOAD ORIGINAL</a><button onclick="copyImageUrl('${esc(p)}')">COPY IMAGE URL</button></div></div>`}
window.fallback=(img,u,id,kind)=>{let box=img.parentElement,drive=u;box.innerHTML=`<div class="missing">Direct image preview โหลดไม่ได้จาก Google Drive บราวเซอร์นี้<br><br><a class="btn" href="${esc(drive)}" target="_blank">OPEN ORIGINAL</a></div>`}
window.copyImageUrl=async u=>{try{await navigator.clipboard.writeText(u);alert('Copied image URL')}catch{prompt('Copy image URL:',u)}}
function block(title,text,key){if(!text)return'';return `<div class="section"><div class="sectionHead"><b>${title}</b><button onclick="copyText('${key}')">COPY</button></div><div class="text" id="${key}">${esc(text)}</div></div>`}
window.copyText=async key=>{let t=$(key)?.innerText||'';try{await navigator.clipboard.writeText(t)}catch{prompt('Copy:',t)}}
function card(s){let m=masterOf(s.id),st=m.still||{};return `<article class="card"><div class="head"><div><h2>${esc(s.id)} — ${esc(s.title)}</h2><div class="date">${esc(s.date)}</div></div><div class="badges"><span class="pill g">MASTER QA PASS</span><span class="pill g">STARTER ${esc(s.starter_qa)}</span><span class="pill g">PROMPT ${esc(s.prompt_qa)}</span></div></div><div class="body"><div class="pair">${asset('MASTER STILL',st.media_url,'master',st.qa1||st.qa2||st.status,s.id)}${asset('STARTER FRAME',s.starter_url,'starter',s.starter_qa,s.id)}</div>${block('MASTER CAPTION',st.caption,'cap-'+s.id)}${block('FIRST / PINNED COMMENT',st.pinned_comment,'pin-'+s.id)}${block('VIDEO PROMPT',s.prompt,'prompt-'+s.id)}</div></article>`}
function render(){let all=qaPairs();$('episode').innerHTML=all.map(x=>`<option value="${esc(x.id)}">${esc(x.date)} • ${esc(x.id)} • ${esc(x.title)}</option>`).join('');let saved=localStorage.getItem('rls_pair_selected');if(saved&&all.some(x=>x.id===saved))$('episode').value=saved;else if(all.length)$('episode').value=all[0].id;renderView()}
function renderView(){let all=qaPairs(),chosen=$('episode').value;localStorage.setItem('rls_pair_selected',chosen);let rows=MODE==='all'?all:all.filter(x=>x.id===chosen);$('list').className=MODE==='all'?'grid all':'grid';$('list').innerHTML=rows.map(card).join('')||'<div class="panel empty">ไม่พบ QA PASS asset</div>';$('status').innerHTML=`<b>${all.length}/24 QA-PASSED PAIRS</b> • โหมด: <span class="g">${MODE==='all'?'SHOW ALL':'SELECTED ONLY'}</span> • ตอนนี้แสดง ${rows.length} วัน`;}
$('episode').addEventListener('change',()=>{if(MODE!=='single'){MODE='single';$('singleBtn').classList.add('on');$('allBtn').classList.remove('on')}renderView()});$('singleBtn').onclick=()=>{MODE='single';$('singleBtn').classList.add('on');$('allBtn').classList.remove('on');renderView()};$('allBtn').onclick=()=>{MODE='all';$('allBtn').classList.add('on');$('singleBtn').classList.remove('on');renderView()};
Promise.all([fetch('./rls-content.json?v='+Date.now()).then(r=>r.json()),fetch('./rls-starters.json?v='+Date.now()).then(r=>r.json())]).then(([c,s])=>{CONTENT=c;STARTERS=s;render()}).catch(e=>{$('status').innerHTML='<span class="r">LOAD ERROR: '+esc(e.message)+'</span>'});
</script>
</body></html>
